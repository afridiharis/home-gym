  if (restDay) {
    const done = st.spineDone > 0;
    return `<section class="card hero" data-st="floor">
      <span class="t-cap">Rest day · recovery builds the strength</span>
      <div class="col"><h2 class="t-display">${done ? "Rest day, handled." : "Spine Reset"}</h2>
      <p class="t-body">${done ? "Your streak is fed. A walk stacks beautifully on top." : "10 minutes keeps your streak alive and your back armoured."}</p></div>
      ${done ? "" : `<button class="btn btn-primary block" data-a="start-spine">${I("play")}Start Spine Reset</button>`}
      <button class="btn btn-secondary block" data-a="train-anyway">Train anyway · ${tpl.name}</button>
    </section>`;
  }

  const { part, w, check } = mainPlan(st);
  const sts = stationsOf(w.items);
  const moves = w.items.filter((i) => !i.warmup).map((i) => i.ex.name);
  const title = part ? `${tpl.name} · part ${part} of 2` : tpl.name;
  const lateQuick = st.late && !part;
  const blocked = check.level === "block" && !UI.override;

  let actions;
  if (blocked) actions = blockedPanel(check);
  else if (lateQuick) actions = `
      <button class="btn btn-primary block" data-a="start-quick">${I("rescue")}Quick version · 8 min</button>
      <p class="t-small" style="text-align:center">Late start? The quick version fully counts.</p>
      <button class="btn btn-secondary block" data-a="start-main">Full ${tpl.name} · ${w.est} min</button>`;
  else actions = `
      ${warnNotes(check)}
      <button class="btn btn-primary block" data-a="start-main">${I("play")}${part ? `Start part ${part}` : "Start workout"}</button>
      <div class="grid-2">
        <button class="btn btn-secondary" data-a="sheet" data-v="plan">${I("split")}${part ? "Change plan" : "Split AM + PM"}</button>
        <button class="btn btn-secondary" data-a="start-quick">${I("rescue")}Quick 8 min</button>
      </div>`;

  return `<section class="card hero">
    <div class="chips">${sts.map(stationChip).join("")}</div>
    <div class="col"><div class="row between" style="align-items:flex-start"><h2 class="t-display">${title}</h2>
      ${st.p1 ? "" : `<button class="btn btn-tinted btn-sm" data-tone="brand" data-a="sheet" data-v="pickday" style="flex-shrink:0;margin-top:4px">${I("sliders", "sm")}Change</button>`}</div>
      <p class="t-body">${tpl.short} · ${plural(moves.length, "move")} · about ${w.est} min${st.pain === "yellow" ? " · eased for a niggly back" : ""}${w.deload ? " · lighter week" : ""}</p>
      ${part ? `<p class="t-small">${moves.join(" · ")}</p>` : ""}
      ${S.profile.anchor ? `<p class="t-cap">After ${esc(S.profile.anchor.replace(/^(right )?after /i, ""))}</p>` : ""}
    </div>
    ${actions}
  </section>`;
}

function alsoToday(st) {
  const rows = [];
  const spineHero = S.phase === 1 || st.pain === "red" || (!st.isTrainDay && !st.p1 && !UI.trainAnyway && !st.mainDone);
  if (!spineHero || st.spineDone) {
    rows.push(`<div class="list-row" data-st="floor"><span class="tile ${st.spineDone ? "done" : ""}">${I(st.spineDone ? "check" : "spine")}</span>
      <div class="col grow"><span class="t-strong">Spine Reset</span><span class="t-small">${st.spineDone ? `Done${st.spineDone > 1 ? ` ×${st.spineDone}` : ""} · 10 min daily back armour` : "10 min · daily back armour"}</span></div>
      <button class="btn btn-tinted btn-sm" data-tone="brand" data-a="start-spine">${st.spineDone ? "Again" : "Start"}</button></div>`);
  }
  rows.push(`<div class="list-row" data-tone="good"><span class="tile ${st.walks >= 2 ? "done" : ""}">${I(st.walks >= 2 ? "check" : "walk")}</span>
    <div class="col grow"><span class="t-strong">Walk</span><span class="t-small">${st.walks} of 2 today · best back medicine there is</span></div>
    <button class="btn btn-tinted btn-sm" data-tone="brand" data-a="sheet" data-v="walk">Log</button></div>`);
  if (!S.profile.barSetting && S.phase > 1) {
    rows.push(`<div class="list-row" data-st="bar"><span class="tile">${I("st-bar")}</span>
      <div class="col grow"><span class="t-strong">Set your bar height · 1 min</span><span class="t-small">Check the ceiling gap first — your head needs room above the bar</span></div>
      <button class="btn btn-tinted btn-sm" data-tone="brand" data-a="sheet" data-v="bar">Set</button></div>`);
  }
  if (towerCheckDue()) {
    rows.push(`<div class="list-row" data-st="bar"><span class="tile">${I("wrench")}</span>
      <div class="col grow"><span class="t-strong">Tower check · 1 min</span><span class="t-small">Tighten the bolts, check the grips — owners say they work loose</span></div>
      <button class="btn btn-tinted btn-sm" data-tone="brand" data-a="tower-checked">Done</button></div>`);
  }
  return `<h2 class="section-title">Also today</h2><div class="list">${rows.join("")}</div>`;
}

function weekStrip() {
  const ws = weekStart(todayKey());
  const cells = [];
  for (let i = 0; i < 7; i++) {
    const d = dayShift(ws, i);
    const logs = sessionsOn(d);
    const strength = logs.some(countsForWeek);
    const any = logs.length > 0;
    const isToday = d === todayKey();
    const planned = S.profile.trainDays.includes((i + 1) % 7);
    const label = new Date(...d.split("-").map((n, j) => (j === 1 ? n - 1 : +n))).toLocaleDateString(undefined, { weekday: "narrow" });
    const cls = strength ? "s" : any ? "l" : S.pain[d] === "red" ? "p" : S.streak.frozen[d] ? "f" : "";
    const mark = strength ? I("check", "sm") : any ? "·" : S.pain[d] === "red" ? "‖" : S.streak.frozen[d] ? I("snowflake", "sm") : planned ? "○" : "";
    cells.push(`<div class="col" style="align-items:center;gap:6px"><span class="t-cap">${label}</span><span class="d ${cls} ${isToday ? "today" : ""}" style="width:36px;height:36px;aspect-ratio:auto">${mark}</span></div>`);
  }
  return `<section class="card" aria-label="This week"><div class="row between" style="margin-bottom:12px"><span class="t-strong">This week</span>
    <button class="btn btn-text btn-sm" data-a="sheet" data-v="streak">${I("snowflake", "sm")} ${plural(S.streak.freezes, "freeze")}</button></div>
    <div class="cal" style="grid-template-columns:repeat(7,1fr)">${cells.join("")}</div></section>`;
}

/* ============================================================
   PLAYER — full-screen, one exercise at a time, one tap to log
   ============================================================ */

function warmupItem(b) {
  const ex = EX[b.ex];
  return { exId: b.ex, ex, sets: b.sets, target: b.target, timed: ex.kind === "secs" || ex.kind === "secside" || b.ex === "walk",
    warmup: true, label: b.label, ramp: b.ramp };
}

function startSession(kind, opts = {}) {
  unlockAudio();
  const pain = painToday() || "green";
  let sess;
  if (kind === "strength") sess = buildWorkout(opts.dayType || todaysDayType(), pain, opts.part ?? null);
  else if (kind === "quick") sess = buildQuick(opts.dayType || todaysDayType(), pain);
  else if (kind === "spine") sess = buildRoutine(SPINE_ROUTINE, "spine");
  else sess = buildRoutine(RESCUE_ROUTINE, "rescue");
  sess.kind = kind;
  sess.items = [...(sess.warmup || []).map(warmupItem), ...sess.items];
  sess.items.forEach((it) => { it.setLog = it.setLog || []; });
  sess.idx = 0; sess.setIdx = 0; sess.startTs = Date.now();
  UI.session = sess;
  UI.override = false;
  snapshotActive(sess);
  acquireWake();
  renderPlayer();
  countdown();
  if (!S.seenSwipe) { S.seenSwipe = true; save(); setTimeout(() => UI.session && showToast("Tip: swipe left or right to move between moves"), 3900); }
}
// 3-2-1-Go over the first move: time to get to the station; tap to skip
function countdown() {
  document.getElementById("countdown")?.remove();
  const it = curItem();
  const el = document.createElement("div");
  el.id = "countdown";
  el.dataset.st = it.ex.st;
  el.setAttribute("role", "status");
  document.body.appendChild(el);
  let n = 3, timer;
  const end = () => { clearTimeout(timer); el.remove(); };
  const step = () => {
    if (!el.isConnected) return;
    if (n === 0) { el.innerHTML = `<span class="n go">Go</span>`; sfx("go"); timer = setTimeout(end, 700); return; }
    el.innerHTML = `<span class="n">${n}</span><span class="t-strong">${n === 3 ? `Get to the ${STATIONS[it.ex.st].short.toLowerCase()}` : esc(it.ex.name)}</span>`;
    sfx("tick");
    n--;
    timer = setTimeout(step, 1000);
  };
  el.addEventListener("click", () => { end(); sfx("go"); });
  step();
}
function resumeSession() {
  const a = restoreActive();
  if (!a) return;
  unlockAudio();
  UI.session = a;
  acquireWake();
  renderPlayer();
}

const curItem = () => UI.session.items[UI.session.idx];
const setTarget = (it, i) => (it.pyramid ? it.pyramid[Math.min(i, it.pyramid.length - 1)] : it.target);

function renderPlayer(dir = 0) {
  const s = UI.session;
  if (!s) return;
  const it = curItem();
  const ex = it.ex;
  const tgt = it._adj ?? setTarget(it, s.setIdx);
  const mains = s.items.filter((x) => !x.warmup);
  const pos = mains.indexOf(it);
  const segs = s.items.map((x, i) => { const n = loggedSets(x);
    return `<i class="${n >= x.sets ? "done" : n ? "part" : ""} ${i === s.idx ? "now" : ""}"></i>`; }).join("");
  const setLabel = loggedSets(it) >= it.sets ? `All ${it.sets} sets done` : `Set ${Math.min(s.setIdx + 1, it.sets)} of ${it.sets}`;
  const unit = kindUnit(ex, tgt) + sideNote(ex);
  const head = it.warmup ? `Warm-up${it.label ? " · " + esc(it.label) : ""}` : `Move ${pos + 1} of ${mains.length}${it.note ? " · " + esc(it.note) : ""}`;
  const clip = ASSETS.clips[it.exId];

  const el = document.createElement("div");
  el.id = "player";
  el.setAttribute("role", "dialog"); el.setAttribute("aria-label", `${s.name}: ${ex.name}`);
  el.innerHTML = `<div class="inner ${dir > 0 ? "in-next" : dir < 0 ? "in-prev" : ""}" data-st="${ex.st}">
    <div class="p-top">
      <button class="btn-icon" data-a="quit" aria-label="End session">${I("close")}</button>
      <div class="segments" aria-hidden="true">${segs}</div>
      <button class="hurt-btn" data-a="sheet" data-v="hurts">${I("spine", "sm")}Back hurts</button>
    </div>
    <div class="station-line">
      <div class="mini-tower">${towerSVG(ex.st)}</div>
      <div class="col grow"><span class="t-strong">${STATIONS[ex.st].go}</span><span class="t-small">${stationHint(ex.st)}</span></div>
    </div>
    <div class="demo" id="demo-box">${clip ? `<video src="${clip}" autoplay muted loop playsinline aria-label="Demo of ${esc(ex.name)}"></video>` : ""}
      ${it.warmup ? `<span class="chip warm-tag" data-tone="warn">${I("today", "sm")}Warm-up</span>` : ""}</div>
    <div class="col">
      <span class="t-cap">${head}</span>
      <h1 class="t-title">${esc(ex.name)}</h1>
      <p class="t-body">${esc(ex.cues[0])}. <button class="btn-text" style="min-height:0;padding:0" data-a="sheet" data-v="ex:${it.exId}">Form tips</button></p>
    </div>
    ${it.timed ? holdBlock(it, tgt, unit) : `<div class="target">
      <span class="t-num">${tgt}</span>
      <div class="col"><span class="t-head">${unit}</span><span class="t-cap">${setLabel}</span>
      <div class="set-dots">${Array.from({ length: it.sets }, (_, i) => `<i class="${it.setLog[i] != null ? "done" : i === s.setIdx ? "now" : ""}"></i>`).join("")}</div></div>
    </div>`}
    <div class="p-actions">
      ${it.timed ? "" : `<button class="btn btn-primary block" data-a="log-set">${I("check")}Done · ${tgt} ${kindUnit(ex, tgt)}</button>`}
      <div class="tertiary">
        <button data-a="swap-easier">${I("easier")}Easier</button>
        ${it.timed ? `<button data-a="time-adj" data-v="10">${I("plus")}+10 s</button>` : `<button data-a="sheet" data-v="count">${I("edit")}Different count</button>`}
        <button data-a="skip-ex">${I("skip")}Skip</button>
      </div>
    </div>
  </div>`;
  const old = document.getElementById("player");
  old ? old.replaceWith(el) : document.body.appendChild(el);
  if (!clip) mountDemo(document.getElementById("demo-box"), it.exId, 200);
}

function holdBlock(it, tgt, unit) {
  const c = 2 * Math.PI * 96;
  return `<div class="hold" aria-live="polite">
      <svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="96" fill="none" stroke="var(--surface-2)" stroke-width="14"/>
      <circle id="hold-arc" cx="110" cy="110" r="96" fill="none" stroke="var(--st)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="0"/></svg>
      <span class="t-num val" id="hold-val">${fmtClock(tgt)}</span>
    </div>
    <div class="col" style="align-items:center"><span class="t-cap">Hold${sideNote(it.ex)} · ${loggedSets(it) >= it.sets ? `all ${it.sets} sets done` : `set ${Math.min(UI.session.setIdx + 1, it.sets)} of ${it.sets}`}</span></div>
    <button class="btn btn-primary block" id="hold-btn" data-a="hold-start">${I("play")}${it.exId === "walk" ? "Start" : "Start hold"}</button>`;
}

/* ---------- holds ---------- */
function startHold() {
  const it = curItem();
  const tgt = it._adj ?? setTarget(it, UI.session.setIdx);
  const endTs = Date.now() + tgt * 1000;
  const c = 2 * Math.PI * 96;
  clearInterval(UI.timer);
  sfx("go");
  const btn = document.getElementById("hold-btn");
  if (btn) { btn.innerHTML = `${I("check")}Done early`; btn.dataset.a = "hold-stop"; btn.classList.replace("btn-primary", "btn-secondary"); }
  let lastTick = null;
  UI.holdEnd = endTs; UI.holdTgt = tgt;
  UI.timer = setInterval(() => {
    const left = Math.max(0, Math.ceil((endTs - Date.now()) / 1000));
    const v = document.getElementById("hold-val"), arc = document.getElementById("hold-arc");
    if (v) v.textContent = fmtClock(left);
    if (arc) arc.style.strokeDashoffset = String(c * (1 - left / tgt));
    if (left <= 3 && left > 0 && left !== lastTick) { lastTick = left; sfx("tick"); }
    if (left === 0) { clearInterval(UI.timer); logSet(tgt); }
  }, 200);
}
function stopHoldEarly() {
  clearInterval(UI.timer);
  const left = Math.max(0, Math.ceil(((UI.holdEnd || Date.now()) - Date.now()) / 1000));
  logSet(Math.max(1, (UI.holdTgt || 0) - left));
}

/* ---------- logging + rest ---------- */
function logSet(val) {
  const s = UI.session, it = curItem();
  if (val == null) val = it._adj ?? setTarget(it, s.setIdx);
  it.setLog[s.setIdx] = val;
  delete it._adj;
  sfx("set-done");
  const lastSet = s.setIdx >= it.sets - 1;
  const nextOpen = s.items.findIndex((x, i) => i > s.idx && loggedSets(x) < x.sets);
  if (lastSet && nextOpen < 0) { finishSession(); return; }
  if (lastSet) { s.idx = nextOpen; s.setIdx = openSet(s.items[nextOpen]); } else s.setIdx++;
  snapshotActive(s);
  const restSec = it.warmup ? 0 : s.type === "strength" || s.type === "quick" ? (it.ladder && !it.volume ? S.settings.restMain : S.settings.restAcc) : S.settings.restSpine;
  renderPlayer();
  if (restSec > 0) startRest(restSec);
}

function startRest(sec) {
  UI.rest = { endTs: Date.now() + sec * 1000 };
  document.querySelectorAll("#rest").forEach((n) => n.remove());
  const nx = curItem();
  const ntgt = setTarget(nx, UI.session.setIdx);
  const div = document.createElement("div");
  div.id = "rest"; div.dataset.st = nx.ex.st;
  div.setAttribute("role", "dialog"); div.setAttribute("aria-label", "Rest");
  div.innerHTML = `
    <span class="t-cap" style="color:var(--st-ink)">Rest — shake it out</span>
    <span class="t-num clock" id="rest-val" aria-live="polite">${fmtClock(sec)}</span>
    <div class="card next"><div class="row">
      <span class="tile" style="background:var(--surface)">${I(STATIONS[nx.ex.st].icon, "lg")}</span>
      <div class="col grow"><span class="t-cap">Next up</span><span class="t-strong">${esc(nx.ex.name)}</span>
      <span class="t-small">Set ${UI.session.setIdx + 1} of ${nx.sets} · ${ntgt} ${kindUnit(nx.ex, ntgt)}${sideNote(nx.ex)}</span></div></div></div>
    <div class="grid-2" style="width:100%;max-width:420px">
      <button class="btn btn-secondary" data-a="rest-add">${I("plus")}15 s</button>
      <button class="btn btn-primary" data-a="rest-skip">Skip rest</button>
    </div>
    <button class="btn btn-text" data-a="quit">End session</button>`;
  document.body.appendChild(div);
  clearInterval(UI.restTimer);
  let warned = false, lastTick = null;
  UI.restTimer = setInterval(() => {
    const left = Math.max(0, Math.ceil((UI.rest.endTs - Date.now()) / 1000));
    const el = document.getElementById("rest-val");
    if (el) { el.textContent = fmtClock(left); el.classList.toggle("ending", left <= 5); }
    if (left === 10 && !warned) { warned = true; sfx("warn10"); }
    if (left <= 3 && left > 0 && left !== lastTick) { lastTick = left; sfx("tick"); }
    if (left === 0) { endRest(); sfx("rest-end"); }
  }, 200);
}
function endRest() { clearInterval(UI.restTimer); UI.rest = null; document.querySelectorAll("#rest").forEach((n) => n.remove()); }

function skipExercise() {
  const s = UI.session;
  if (s.idx >= s.items.length - 1) { clearInterval(UI.timer); finishSession(); return; }
  goToItem(s.idx + 1, 1);
}

/* ---------- moving between moves: swipe, arrow keys, Skip ---------- */
const loggedSets = (it) => it.setLog.filter((v) => v != null).length;
// the set to pick up on: the first one not logged yet (a move you come back to keeps what you logged)
const openSet = (it) => Math.min(loggedSets(it), it.sets - 1);

function goToItem(i, dir) {
  const s = UI.session;
  if (!s || i < 0 || i >= s.items.length || i === s.idx) return;
  clearInterval(UI.timer); endRest();
  delete curItem()._adj;
  s.idx = i; s.setIdx = openSet(s.items[i]);
  snapshotActive(s);
  renderPlayer(dir);
}

// the card follows the finger; touch-action: pan-y on #player keeps vertical scrolling native
let swipe = null;
document.addEventListener("pointerdown", (e) => {
  const inner = e.target.closest?.("#player .inner");
  if (!inner || !UI.session || e.pointerType === "mouse") return;
  if (e.clientX < 20 || e.clientX > innerWidth - 20) return; // leave the screen edges to the system
  swipe = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, dx: 0, on: false, inner };
});
document.addEventListener("pointermove", (e) => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (!swipe.on) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; } // a scroll, not a swipe
    if (Math.abs(dx) < 12) return;
    swipe.on = true;
    swipe.inner.style.transition = "none";
  }
  const s = UI.session;
  const atEnd = (dx > 0 && s.idx === 0) || (dx < 0 && s.idx === s.items.length - 1);
  swipe.dx = atEnd ? dx / 3 : dx; // rubber-band past the first and last move
  swipe.inner.style.transform = `translateX(${swipe.dx}px)`;
});
function endSwipe(e) {
  if (!swipe || e.pointerId !== swipe.id) return;
  const sw = swipe;
  swipe = null;
  if (!sw.on) return;
  UI.swipedAt = Date.now();
  const s = UI.session;
  const fast = Math.abs(sw.dx) > 50 && Math.abs(sw.dx) / (performance.now() - sw.t) > 0.45;
  const far = Math.abs(sw.dx) > innerWidth * 0.22;
  const to = sw.dx < 0 ? s.idx + 1 : s.idx - 1;
  if (e.type === "pointerup" && (far || fast) && to >= 0 && to < s.items.length) {
    sw.inner.style.transition = "transform .15s ease-in";
    sw.inner.style.transform = `translateX(${sw.dx < 0 ? -110 : 110}%)`;
    setTimeout(() => goToItem(to, sw.dx < 0 ? 1 : -1), 140);
    return;
  }
  if (e.type === "pointerup" && (far || fast)) showToast(sw.dx < 0 ? "That's the last move — log it or tap ✕ to finish" : "This is the first move");
  sw.inner.style.transition = "transform .2s ease-out";
  sw.inner.style.transform = "";
}
document.addEventListener("pointerup", endSwipe);
document.addEventListener("pointercancel", endSwipe);
document.addEventListener("keydown", (e) => {
  if (!UI.session || UI.sheet || UI.rest || document.getElementById("countdown")) return;
  if (e.key === "ArrowRight") goToItem(UI.session.idx + 1, 1);
  if (e.key === "ArrowLeft") goToItem(UI.session.idx - 1, -1);
});
function swapEasier() {
  clearInterval(UI.timer);
  const it = curItem();
  delete it._adj;
  if (it.ladder) {
    const r = ladderRung(it.ladder);
    const curIdx = r ? r.idx : 0;
    if (curIdx > 0) {
      const easier = LADDERS[it.ladder].rungs[curIdx - 1];
      it.exId = easier.ex; it.ex = EX[easier.ex];
      const win = easier.scheme.reps || easier.scheme.secs;
      it.target = win[0]; it.timed = !!easier.scheme.secs; it.ladder = null; // no progression credit for a swap
      showToast(`Swapped to ${it.ex.name} for today`);
    } else { it.target = Math.max(1, Math.floor(it.target * 0.6)); showToast("Target lowered — quality over quantity"); }
  } else {
    it.target = Math.max(1, Math.floor((it.target || 8) * 0.6));
    showToast("Target lowered — listen to your body");
  }
  snapshotActive(UI.session);
  renderPlayer();
}
function quitSession() {
  clearInterval(UI.timer); endRest(); stopDemo(); releaseWake();
  UI.session = null; S.active = null; save();
  document.getElementById("player")?.remove();
  render();
}

/* ---------- finish: celebrate → one-tap feedback → unlocks ---------- */
function finishSession() {
  const s = UI.session;
  clearInterval(UI.timer); endRest(); stopDemo();
  const mins = Math.max(1, Math.round((Date.now() - s.startTs) / 60000));
  const res = completeSession(s, mins);
  releaseWake();
  // a fresh URL replays the play-once burst every finish; afterwards pin the still (Safari may not hold the last frame)
  UI.done = { s, mins, res, rpe: null, back: null, burst: ASSETS.celebrate && `${ASSETS.celebrate}?r=${Date.now()}` };
  if (ASSETS.celebrateStill) setTimeout(() => {
    if (!UI.done) return;
    UI.done.burst = ASSETS.celebrateStill;
    const b = document.querySelector(".done-hero img.burst");
    if (b) b.src = ASSETS.celebrateStill;
  }, 1900);

const LADDER_ST = { vpull: "bar", hpull: "dips", dip: "dips", push: "push", vpush: "floor", vkr: "knee", lsit: "push", squat: "floor", hinge: "floor" };

/* Sessions-until-next-rung for each ladder (2 good sessions per +1 rep, 2 more at the top). */
function nextUnlocks() {
  const out = [];
  for (const k of Object.keys(LADDERS)) {
    const t = ladderTarget(k);
    if (!t) continue;
    const L = LADDERS[k];
    if (t.idx >= L.rungs.length - 1) continue;
    const [lo, hi] = t.win;
    const ok = S.targets[t.tkey + ":ok"] || 0;
    const total = (hi - lo) * 2 + 2;
    const left = Math.max(1, (hi - t.target) * 2 + 2 - ok);
    const nx = EX[L.rungs[t.idx + 1].ex];
    out.push({ k, now: EX[t.rung.ex], next: nx, left, pct: Math.max(4, Math.round((1 - left / total) * 100)), locked: nx.phase > S.phase });
  }
  return out.sort((a, b) => a.left - b.left);
}

function cameFar(k) {
  const ids = new Set(LADDERS[k].rungs.map((r) => r.ex));
  const sets = [];
  for (const l of S.log) for (const s of l.sets || []) if (ids.has(s.ex)) sets.push({ ...s, ts: l.ts });
  if (sets.length < 2) return null;
  sets.sort((a, b) => a.ts - b.ts);
  const firstDay = sets[0].ts, lastEx = sets[sets.length - 1].ex;
  const first = sets.filter((s) => s.ts === firstDay).reduce((a, s) => (s.val > a.val ? s : a));
  const now = sets.filter((s) => s.ex === lastEx).slice(-6).reduce((a, s) => (s.val > a.val ? s : a));
  if (first.ex === now.ex && now.val <= first.val) return null;
  const fmt = (s) => `${EX[s.ex].name} × ${EX[s.ex].kind.includes("sec") ? fmtClock(s.val) : s.val}`;
  return { from: fmt(first), to: fmt(now) };
}

function calendar() {
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + (UI.calOffset || 0), 1);
  const lead = (base.getDay() + 6) % 7;
  const days = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  const cells = ["M", "T", "W", "T", "F", "S", "S"].map((d) => `<span class="dow">${d}</span>`);
  for (let i = 0; i < lead; i++) cells.push(`<span class="d empty"></span>`);
  for (let d = 1; d <= days; d++) {
    const key = dkey(new Date(base.getFullYear(), base.getMonth(), d));
    const logs = sessionsOn(key);
    const cls = logs.some(countsForWeek) ? "s" : logs.length ? "l" : S.pain[key] === "red" ? "p" : S.streak.frozen[key] ? "f" : "";
    cells.push(`<span class="d ${cls} ${key === todayKey() ? "today" : ""}" aria-label="${fmtDate(key)}: ${logs.length ? esc(logs.map((l) => l.name).join(", ")) : cls === "p" ? "rough back day" : cls === "f" ? "streak freeze" : "rest"}">${d}</span>`);
  }
  return `<div class="stack">
    <div class="row between"><button class="btn-icon" data-a="cal" data-v="-1" aria-label="Previous month">${I("chev-left", "sm")}</button>
      <span class="t-strong">${base.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</span>
      <button class="btn-icon" data-a="cal" data-v="1" aria-label="Next month" ${UI.calOffset >= 0 ? "disabled" : ""}>${I("chev-right", "sm")}</button></div>
    <div class="cal">${cells.join("")}</div>
    <div class="legend"><span><i style="background:var(--brand)"></i>Workout</span><span><i style="background:var(--brand-tint)"></i>Spine / walk</span>
      <span><i style="background:var(--bad-tint)"></i>Rough-back pause</span><span><i style="background:var(--bar-tint)"></i>Freeze</span></div>
  </div>`;
}

function weightSpark() {
  const data = S.weights.slice(-30);
  const W = 320, Hh = 80, pad = 6;
  const v = data.map((d) => d.kg), mn = Math.min(...v), mx = Math.max(...v), span = Math.max(0.5, mx - mn);
  const px = (i) => pad + (i / Math.max(1, data.length - 1)) * (W - pad * 2);
  const py = (k) => pad + (1 - (k - mn) / span) * (Hh - pad * 2);
  const d = data.map((p, i) => `${i ? "L" : "M"}${px(i).toFixed(1)},${py(p.kg).toFixed(1)}`).join("");
  const area = `${d}L${px(data.length - 1).toFixed(1)},${Hh}L${px(0)},${Hh}Z`;
  const last = data[data.length - 1];
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Bodyweight trend, ${data[0].kg} to ${last.kg} kg">
    <path d="${area}" fill="var(--knee-tint)"/><path d="${d}" fill="none" stroke="var(--knee-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${px(data.length - 1)}" cy="${py(last.kg)}" r="5" fill="var(--knee-ink)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

/* ============================================================
   SHEETS — everything one tap deep. Every sheet has a visible close button.
   ============================================================ */

function renderSheet() {
  document.querySelector(".sheet-backdrop")?.remove();
  if (!UI.sheet) return;
  const [kind, arg] = UI.sheet.split(":");
  const body = (SHEETS[kind] || (() => ""))(arg);
  if (!body) { UI.sheet = null; return; }
  const bd = document.createElement("div");
  bd.className = "sheet-backdrop";
  bd.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div>`;
  bd.addEventListener("click", (e) => { if (e.target === bd) closeSheet(); });
  document.body.appendChild(bd);
  if (kind === "ex") mountDemo(document.getElementById("demo-sheet"), arg, 220);
  bd.querySelector("button, input, a")?.focus({ preventScroll: true });
}
const sheetTop = (title, sub = "") => `<div class="sheet-top"><div class="col"><h2 class="t-head">${title}</h2>${sub ? `<span class="t-small">${sub}</span>` : ""}</div>
  <button class="btn-icon" data-a="sheet-close" aria-label="Close">${I("close", "sm")}</button></div>`;
const ul = (items) => `<ul class="stack t-body" style="margin-left:20px;gap:6px">${items.map((x) => `<li>${x}</li>`).join("")}</ul>`;

const SHEETS = {
  /* ---- the day planner ---- */
  plan() {
    const st = todayState();

      <span class="radio"></span><span class="col"><span class="t-strong">${title}</span><span class="t-small">${sub}</span>${extra}</span></button>`;
    const other = DAY_TEMPLATES[DAY_ORDER.find((d) => DAY_TEMPLATES[d].region !== tpl.region)];
    return `${sheetTop("How do you want to do today?")}
      ${opt("split", "Split it: morning + evening", `Part 1 (~${a.est} min): ${names(a)}. Part 2 (~${b.est} min, 4–6 h later): ${names(b)}.`, `<span class="pill-note">Same total work · research-backed</span>`)}

      ${notice("brand", "info", "Splitting a day's work in two is safe — studies even show a small strength edge. <b>Adding</b> extra work is where the risk is, so FORGE keeps an eye on that.")}

  },

  pickday() {
    const st = todayState();

    const rows = DAY_ORDER.map((d) => {
      const tpl = DAY_TEMPLATES[d];
      const w = buildWorkout(d, st.pain || "green");

      const last = [...S.log].reverse().find((l) => l.type === "strength" && l.dayType === d && l.part !== 1);
      const moves = w.items.filter((i) => !i.warmup).slice(0, 3).map((i) => i.ex.name).join(" · ");

        <span class="radio"></span><span class="col grow" style="gap:3px">

      </div>
      <p class="t-small">Judge yesterday's session by this morning's back. Worse morning = yesterday was too much.</p>
      <div class="card" data-tone="bad"><div class="stack"><span class="t-strong" style="color:var(--bad-ink)">See a doctor the same day if</span>${ul(RED_FLAGS)}</div></div>
      <p class="t-cap">FORGE is a training tool, not medical advice. If symptoms persist past ~6 weeks, get assessed by a physio.</p>`;
  },
  multi() {
    return `${sheetTop("Two sessions in a day")}
      <div class="list">
        <div class="list-row" data-tone="good"><span class="tile">${I("split")}</span><div class="col"><span class="t-strong">Splitting a day: yes</span><span class="t-small">Doing one day's workout as a morning half and an evening half is safe — some studies even show a small strength edge.</span></div></div>
        <div class="list-row" data-tone="warn"><span class="tile">${I("plus")}</span><div class="col"><span class="t-strong">Second full session: with care</span><span class="t-small">Other half of your body, at least 6 hours later, not on a niggly-back day. Never knee raises in both.</span></div></div>
        <div class="list-row" data-tone="bad"><span class="tile">${I("lock")}</span><div class="col"><span class="t-strong">Same muscles inside 24 h: no</span><span class="t-small">They need about a day to rebuild — that's when you actually get stronger.</span></div></div>
      </div>
      <p class="t-body">FORGE keeps count for you: about 20 hard sets a day is a big day, 26 is the ceiling, and 10–20 per muscle per week is the sweet spot. Walks and Spine Resets don't count against any of it.</p>
      <p class="t-cap">Sources: split-session studies (Häkkinen 1994, Hartman 2007), volume dose–response (Schoenfeld 2017), recovery time-course (MacDougall 1995).</p>`;
  },
  abs() {
    const kg = S.weights.length ? S.weights[S.weights.length - 1].kg : null;
    return `${sheetTop("The abs maths")}
      <p class="t-body">Visible abs are ~10–14% body fat for most men. The core work you're doing builds them; the deficit reveals them.</p>
      <div class="grid-2"><div class="stat"><span class="t-num">${kg ? `${Math.round(kg * 1.8)}–${Math.round(kg * 2.2)}g` : "1.8–2.2 g/kg"}</span><span class="t-cap">protein a day</span></div>
        <div class="stat"><span class="t-num">300–500</span><span class="t-cap">kcal deficit a day</span></div></div>
      ${ul(["Lose about 0.5–1% of bodyweight a week — faster costs strength.", "Weigh daily, judge by the weekly average.", "Take a week at maintenance every 6–8 weeks.", "If pull-up numbers drop two weeks running, eat a bit more."])}`;
  },
  guide() {
    return `${sheetTop("iPhone setup")}
      <div class="list">
        <div class="list-row"><span class="tile">${I("phone")}</span><div class="col"><span class="t-strong">1 · Add to Home Screen</span><span class="t-small">In Safari: Share → Add to Home Screen. Full-screen app, and iOS stops auto-clearing your data.</span></div></div>
        <div class="list-row"><span class="tile">${I("bell")}</span><div class="col"><span class="t-strong">2 · Calendar reminders</span><span class="t-small">Me → Reminders. Open the file and tap Add All — real alerts on training days.</span></div></div>
        <div class="list-row"><span class="tile">${I("clock")}</span><div class="col"><span class="t-strong">3 · A proper alarm</span><span class="t-small">Ask Siri: "Set a repeating alarm at ${esc(S.profile?.time || "18:00")} on weekdays called Forge."</span></div></div>
        <div class="list-row"><span class="tile">${I("timer")}</span><div class="col"><span class="t-strong">4 · During workouts</span><span class="t-small">Keep the screen on — iOS pauses web timers when it locks. FORGE saves every set, so you can always resume.</span></div></div>
        <div class="list-row"><span class="tile">${I("download")}</span><div class="col"><span class="t-strong">5 · Back up now and then</span><span class="t-small">Me → Back up my data. Ten seconds of peace of mind.</span></div></div>
      </div>
      <button class="btn btn-primary block" data-a="guide-done">Got it</button>`;
  },
  whatsnew() {
    return `${sheetTop("FORGE has a fresh look", "Same plan, your data's all here.")}
      <div class="list">
        <div class="list-row" data-tone="brand"><span class="tile">${I("play")}</span><div class="col"><span class="t-strong">One big button</span><span class="t-small">Today always shows exactly what to do next.</span></div></div>
        <div class="list-row" data-st="bar"><span class="tile">${I("moves")}</span><div class="col"><span class="t-strong">Built around your tower</span><span class="t-small">Every move shows which station to use and how to set it up.</span></div></div>
        <div class="list-row" data-tone="good"><span class="tile">${I("split")}</span><div class="col"><span class="t-strong">Split days &amp; two-a-days</span><span class="t-small">Morning + evening halves, or a second session — with research-backed limits.</span></div></div>
        <div class="list-row" data-tone="warn"><span class="tile">${I("undo")}</span><div class="col"><span class="t-strong">Never lose a session</span><span class="t-small">Every set is saved. Lock your phone, come back, resume.</span></div></div>
      </div>
      <div class="grid-2">
        <label class="field"><span class="t-cap">What should we call you?</span><input type="text" id="set-name" maxlength="30" placeholder="Name" value="${esc(S.profile.name || "")}"></label>
        <label class="field"><span class="t-cap">Usual wake time</span><input type="time" id="set-wake" value="${S.profile.wake}"></label>
      </div>
      <button class="btn btn-primary block" data-a="whatsnew-done">Let's go</button>`;
  },
  import() {
    return `${sheetTop("Restore a backup", "This replaces what's on this device.")}
      <textarea id="import-text" rows="6" placeholder="Paste the contents of a forge-backup file"></textarea>
      <label class="btn btn-secondary block" style="position:relative">${I("upload")}Choose a file<input type="file" id="import-file" accept=".json,application/json" style="position:absolute;inset:0;opacity:0"></label>
      <button class="btn btn-primary block" data-a="import-go">Restore</button>`;
  },
  copyout() { return UI.copyBody || ""; },
};

/* Copy-based fallback where downloads can't happen (home-screen app, sandboxed frames) */
function openCopySheet(name, content, label) {
  UI.copyBody = `${sheetTop(esc(label || "Your file"))}
    <p class="t-body">Downloads don't work in this mode. Copy the text and save it as <b>${esc(name)}</b>${name.endsWith(".ics") ? " — then open that file to add the events. (Or open FORGE in Safari, where the download works in one tap.)" : "."}</p>
    <textarea rows="7" readonly id="copy-src">${esc(content)}</textarea>
    <button class="btn btn-primary block" data-a="copy-text">Copy</button>`;
  openSheet("copyout");
}

/* ============================================================
   FORGE — wiring: render root, nav, actions, inputs, boot
   ============================================================ */

const NAV = [
  { id: "today", ico: "today", label: "Today" },
  { id: "progress", ico: "progress", label: "Progress" },
  { id: "moves", ico: "moves", label: "Moves" },
  { id: "me", ico: "me", label: "Me" },
];
function renderNav() {
  document.getElementById("nav")?.remove();
  const nav = document.createElement("nav");
  nav.id = "nav"; nav.setAttribute("aria-label", "Main");
  nav.innerHTML = `<div class="inner">${NAV.map((n) => `<button data-a="nav" data-v="${n.id}" class="${UI.screen === n.id ? "active" : ""}" ${UI.screen === n.id ? 'aria-current="page"' : ""}>${I(n.ico)}${n.label}</button>`).join("")}</div>`;
  document.body.appendChild(nav);
}
function render() {
  applyTheme();
  if (!S.profile) { renderOnboard(); return; }
  recomputeStreak();
  ({ today: renderToday, progress: renderProgress, moves: renderMoves, me: renderMe }[UI.screen] || renderToday)();
  renderNav();
}
const rerenderSheet = () => renderSheet();

/* Start a strength-type session after the back check and guardrails. */
function requireCheckin(then) {
  if (painToday()) return then();
  UI.afterCheckin = then;
  openSheet("paincheck");
}
function startMain() {
  const st = todayState();
  const { part, check } = mainPlan(st);
  if (check.level === "block" && !UI.override) { showToast(check.notes.find((n) => n.level === "block").text); return; }
  startSession("strength", { dayType: st.dayType, part });
}
function startQuick() {
  const st = todayState();
  const q = buildQuick(st.dayType, st.pain || "green");
  const check = checkStrength({ items: q.items, dayType: st.dayType, quick: true });
  const hard = check.notes.find((n) => n.level === "block" && /back|Phase|hour of waking/.test(n.text));
  if (hard && !UI.override) { showToast(hard.text); return; }
  startSession("quick", { dayType: st.dayType });
}

const ACTIONS = {
  nav: (el) => { UI.screen = el.dataset.v; UI.trainAnyway = false; closeSheet(); render(); window.scrollTo(0, 0); },
  sheet: (el) => { UI.planPick = null; UI.countVal = null; openSheet(el.dataset.v); },
  "sheet-close": () => closeSheet(),
  "confirm-yes": () => { const fn = UI.pendingConfirm; closeSheet(); fn && fn(); },

  /* today */
  pain: (el) => { setPain(el.dataset.v); render(); },
  "pain-reset": () => { delete S.pain[todayKey()]; save(); render(); },
  "pain-then-start": (el) => { setPain(el.dataset.v); closeSheet(); render(); const f = UI.afterCheckin; UI.afterCheckin = null; if (f && el.dataset.v !== "red") f(); },
  "start-main": () => requireCheckin(startMain),
  "start-quick": () => requireCheckin(startQuick),
  "start-spine": () => {
    const c = checkSpine();
    if (c.level === "warn") return askConfirm({ title: c.notes[0].text, body: c.notes[0].why, yes: "Do it anyway", no: "Not now", onYes: () => startSession("spine") });
    startSession("spine");
  },
  "start-second": (el) => requireCheckin(() => {
    const dayType = el.dataset.v;
    const w = buildWorkout(dayType, painToday() || "green");
    const c = checkStrength({ items: w.items, dayType });
    if (c.level === "block") { showToast(c.notes.find((n) => n.level === "block").text); return; }
    startSession("strength", { dayType });
  }),
  "train-anyway": () => { UI.trainAnyway = true; render(); },
  override: () => {
    const { check } = mainPlan(todayState());
    askConfirm({ title: "Train anyway?", body: check.notes.filter((n) => n.level === "block").map((n) => `<b>${n.text}</b> ${n.why}`).join("<br><br>"),
      yes: "I understand — start", no: "Good point, not now", onYes: () => { UI.override = true; requireCheckin(startMain); } });
  },
  resume: () => resumeSession(),
  "resume-discard": () => askConfirm({ title: "Discard this session?", body: "The sets you logged in it won't be saved.", danger: true, yes: "Discard", onYes: () => { S.active = null; save(); render(); } }),
  "deload-start": () => { S.deload = todayKey(); save(); render(); showToast("Lighter week on — sets trimmed for 7 days"); },
  "deload-dismiss": () => { S.deloadDismissed = todayKey(); save(); render(); },
  "tower-checked": () => { S.towerCheck = todayKey(); save(); render(); showToast("Tower checked — nice."); },
  "pick-day": (el) => {
    const t = todayKey(), d = el.dataset.v;
    S.plans[t] = { mode: S.plans[t]?.mode || "one", dayType: d };
    UI.override = false;
    save(); closeSheet(); render();
    showToast(`Today: ${DAY_TEMPLATES[d].name} · ${DAY_TEMPLATES[d].short.toLowerCase()}`);
  },
  "plan-pick": (el) => { UI.planPick = el.dataset.v; rerenderSheet(); },
  "plan-use": () => { S.plans[todayKey()] = { ...S.plans[todayKey()], mode: UI.planPick || S.plans[todayKey()]?.mode || "one" }; save(); closeSheet(); render(); showToast(S.plans[todayKey()].mode === "split" ? "Split day — part 1 first" : "One go it is"); },

  /* player */
  "log-set": () => logSet(),
  "hold-start": () => startHold(),
  "hold-stop": () => stopHoldEarly(),
  "time-adj": (el) => { const it = curItem(); it._adj = Math.max(5, (it._adj ?? setTarget(it, UI.session.setIdx)) + Number(el.dataset.v)); renderPlayer(); },
  "rest-add": () => { if (UI.rest) UI.rest.endTs += 15000; },
  "rest-skip": () => endRest(),
  "skip-ex": () => skipExercise(),
  "swap-easier": () => swapEasier(),
  quit: () => {
    if (!UI.session) return;
    const hasMain = UI.session.items.some((i) => !i.warmup && i.setLog?.some((v) => v != null));
    if (hasMain) askConfirm({ title: "End here?", body: "Everything you've logged is saved and counts. Stopping early beats not starting — every time.", yes: "Save & end", no: "Keep going", onYes: () => finishSession() });
    else openSheet("quitconfirm");
  },
  "quit-quick": () => { closeSheet(); quitSession(); startQuick(); },
  "quit-anyway": () => { closeSheet(); quitSession(); showToast("No worries — the day's still yours."); },
  "count-step": (el) => { UI.countVal = Math.max(0, (UI.countVal || 0) + Number(el.dataset.v)); const v = document.getElementById("count-val"); if (v) v.textContent = UI.countVal; },
  "count-log": () => { const v = UI.countVal; closeSheet(); UI.countVal = null; logSet(v); },
  "hurts-mild": () => { setPain("yellow"); closeSheet(); showToast("Logged. Shorten the range and keep it smooth."); },
  "hurts-skip": () => { closeSheet(); swapEasier(); },
  "hurts-leg": () => { setPain("red"); openSheet("legstop"); },
  "legstop-done": () => {
    closeSheet();
    if (!UI.session) { render(); return; }
    if (UI.session.items.some((i) => !i.warmup && i.setLog?.some((v) => v != null))) finishSession(); else quitSession();
  },
  "fb-rpe": (el) => { UI.done.rpe = el.dataset.v; renderDone(); },
  "fb-back": (el) => { UI.done.back = el.dataset.v; renderDone(); },
  "done-finish": () => {
    const { s, res, rpe, back } = UI.done;
    const { offers } = finalizeSession(res.logId, s, rpe || "right", back || "ok");
    if (back === "worse") showToast("Noted — tomorrow starts gentle.");
    if (offers.length) renderUnlocks(offers); else ACTIONS["done-close"]();
  },
  "done-close": () => { document.getElementById("player")?.remove(); UI.done = null; UI.screen = "today"; render(); window.scrollTo(0, 0); },
  "ladder-up": (el) => { ladderUp(el.dataset.v); sfx("levelup"); el.outerHTML = `<span class="badge-done">${I("check", "sm")}Climbed — it's in your next session</span>`; },
  "ladder-down": (el) => { const k = el.dataset.v; S.levels[k] = Math.max(0, (S.levels[k] ?? 0) - 1); save(); closeSheet(); render(); showToast("Dropped a rung — smart training."); },

  /* logging */
  "walk-save": (el) => {
    const mins = Number(el.dataset.v);
    tryRepair();
    S.xp += XP_RULES.walk;
    S.log.push({ id: uid(), date: todayKey(), ts: Date.now(), type: "walk", name: `${mins}-min walk`, mins, sets: [], xp: XP_RULES.walk, hard: {} });
    recomputeStreak(); checkBadges(); save(); closeSheet(); render();
    showToast(`Walk logged · +${XP_RULES.walk} XP`);
  },
  "weight-save": () => {
    const kg = parseFloat(document.getElementById("w-kg")?.value);
    if (!kg || kg < 25 || kg > 350) { showToast("Enter your weight in kg"); return; }
    S.weights = S.weights.filter((w) => w.date !== todayKey());
    S.weights.push({ date: todayKey(), kg: Math.round(kg * 10) / 10 });
    save(); closeSheet(); render(); showToast("Weight logged");
  },
  cal: (el) => { UI.calOffset = Math.min(0, (UI.calOffset || 0) + Number(el.dataset.v)); renderProgress(); },
  "lib-st": (el) => { UI.libSt = el.dataset.v && UI.libSt !== el.dataset.v ? el.dataset.v : null; renderMoves(); },

  /* me */
  "set-day": (el) => {
    const i = Number(el.dataset.v), d = S.profile.trainDays;
    S.profile.trainDays = d.includes(i) ? d.filter((x) => x !== i) : [...d, i].sort();
    if (!S.profile.trainDays.length) S.profile.trainDays = [i];
    save(); rerenderSheet();
  },
  "set-target": (el) => { S.profile.weeklyTarget = Number(el.dataset.v); save(); rerenderSheet(); },
  "set-bar": (el) => { S.profile.barSetting = Number(el.dataset.v); save(); closeSheet(); render(); showToast(`Bar set to ${el.dataset.v}`); },
  "set-theme": (el) => { S.settings.theme = el.dataset.v; save(); render(); },
  "set-rest": (el) => { S.settings.restMain = Number(el.dataset.v); save(); render(); },
  "phase-up": () => {
    const ph = PHASES[S.phase - 1];
    askConfirm({ title: `Move to Phase ${S.phase + 1}?`, body: `Be honest with yourself:<br><br><b>${ph.gate}</b>`, yes: "That's me — advance", no: "Not yet",
      onYes: () => { S.phase++; checkBadges(); save(); render(); showToast(`Welcome to Phase ${S.phase}`); } });
  },
  "phase-down": () => askConfirm({ title: "Drop back a phase?", body: "Smart during a flare — zero shame. Your ladder levels are kept.", yes: "Drop back",
    onYes: () => { S.phase--; save(); render(); showToast("Phase adjusted. The ladder isn't going anywhere."); } }),
  "ics-schedule": async () => {
    const r = await deliverFile("forge-training.ics", buildScheduleICS(), "text/calendar;charset=utf-8", "Training calendar");
    if (r === "downloaded") showToast("Downloaded — open the file, then Add All");
    else if (r === "shared") showToast("Open it in Calendar → Add All");
  },
  "ics-spine": async () => {
    const r = await deliverFile("forge-spine-reset.ics", buildSpineICS(S.profile.time), "text/calendar;charset=utf-8", "Spine Reset calendar");
    if (r === "downloaded") showToast("Downloaded — open the file, then Add All");
    else if (r === "shared") showToast("Open it in Calendar → Add All");
  },
  "guide-done": () => { S.seenGuide = true; save(); closeSheet(); },
  "export-data": async () => {
    const r = await exportData();
    if (r === "downloaded") showToast("Backup saved");
    else if (r === "shared") showToast("Backup shared — keep it somewhere safe");
  },
  "import-go": () => {
    try { importData(document.getElementById("import-text").value); closeSheet(); UI.ob = { step: 0 }; render(); showToast("Restored — welcome back"); }
    catch (e) { showToast("That doesn't look like a FORGE backup"); }
  },
  "copy-text": () => {
    const src = document.getElementById("copy-src");
    if (!src) return;
    src.select();
    const ok = () => showToast("Copied");
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(src.value).then(ok, () => { document.execCommand("copy"); ok(); });
    else { document.execCommand("copy"); ok(); }
  },
  "rescue-dump": () => openCopySheet("forge-rescued-data.json", RESCUE_RAW || "", "Rescued data"),
  "reset-all": () => askConfirm({ title: "Wipe everything?", danger: true, body: "All history, streaks, levels and settings on this device. Back up first if there's any doubt.",
    yes: "Continue", no: "Keep my data",
    onYes: () => askConfirm({ title: "Really sure?", danger: true, body: "This can't be undone.", yes: "Yes — wipe it", no: "Cancel",
      onYes: () => { localStorage.removeItem(STORE_KEY); S = defaultState(); UI.screen = "today"; UI.ob = { step: 0 }; render(); } }) }),
  "whatsnew-done": () => { S.seenV2 = true; save(); closeSheet(); render(); },

  /* onboarding */
  "ob-next": () => { UI.ob.step++; renderOnboard(); window.scrollTo(0, 0); },
  "ob-prev": () => { UI.ob.step = Math.max(0, UI.ob.step - 1); renderOnboard(); },
  "ob-redflag": () => { UI.ob.rf = true; renderOnboard(); },
  "ob-rf-back": () => { UI.ob.rf = false; renderOnboard(); },
  "ob-set": (el) => {
    const k = el.dataset.k, v = el.dataset.v;
    UI.ob[k] = k === "legs" ? v === "yes" : ["vpull", "dip", "push"].includes(k) ? Number(v) : v;
    renderOnboard();
  },
  "ob-day": (el) => {
    const i = Number(el.dataset.v), d = UI.ob.days || [1, 2, 4, 5];
    UI.ob.time = document.getElementById("ob-time")?.value; UI.ob.wake = document.getElementById("ob-wake")?.value; UI.ob.name = document.getElementById("ob-name")?.value;
    UI.ob.days = d.includes(i) ? d.filter((x) => x !== i) : [...d, i].sort();
    renderOnboard();
  },
  "ob-finish": () => {
    const o = UI.ob;
    const days = (o.days || [1, 2, 4, 5]);
    if (!days.length) { showToast("Pick at least one training day"); return; }
    const map = { vpull: [0, 3, 5, 6], dip: [0, 2, 3, 4], push: [0, 1, 2, 3] };
    S.levels.vpull = map.vpull[o.vpull || 0]; S.levels.dip = map.dip[o.dip || 0]; S.levels.push = map.push[o.push || 0];
    S.phase = o.back === "1" ? 1 : 2;
    if (S.phase === 1) { S.levels.vpull = 0; S.levels.dip = 0; }
    S.profile = { trainDays: days, time: document.getElementById("ob-time")?.value || "18:00", wake: document.getElementById("ob-wake")?.value || "07:00",
      anchor: "", legs: !!o.legs, created: todayKey(), weeklyTarget: Math.min(5, days.length), barSetting: null,
      name: (document.getElementById("ob-name")?.value || "").trim().slice(0, 30) };
    S.seenV2 = true;
    save(); UI.screen = "today"; render(); window.scrollTo(0, 0);
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  if (UI.swipedAt && Date.now() - UI.swipedAt < 350 && el.closest("#player")) return;
  const fn = ACTIONS[el.dataset.a];
  if (!fn) return;
  e.preventDefault();
  try { fn(el); } catch (err) { console.error(err); showToast("Something went wrong — " + (err?.message || "try again")); }
});
document.addEventListener("input", (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === "lib-q") { UI.libQ = v; const l = document.getElementById("lib-list"); if (l) l.innerHTML = movesList(); }
  if (!S.profile) return;
  if (id === "set-time" && /^\d{2}:\d{2}$/.test(v)) { S.profile.time = v; save(); }
  if (id === "set-wake" && /^\d{2}:\d{2}$/.test(v)) { S.profile.wake = v; save(); }
  if (id === "set-anchor") { S.profile.anchor = v.slice(0, 60); save(); }
  if (id === "set-name") { S.profile.name = v.trim().slice(0, 30); save(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "set-sound") { S.settings.sound = e.target.checked; save(); if (S.settings.sound) { unlockAudio(); sfx("set-done"); } render(); }
  if (e.target.id === "import-file" && e.target.files?.[0]) {
    e.target.files[0].text().then((t) => { const ta = document.getElementById("import-text"); if (ta) ta.value = t; });
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !UI.session && !UI.done && !UI.sheet && S.profile) render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);

/* ---------- boot ---------- */
try {
  load();
  if (S.active && S.active.date !== todayKey()) { S.active = null; save(); }
  render();
  if (S.profile && !S.seenV2) openSheet("whatsnew");
} catch (e) {
  console.error(e);
  const app = document.getElementById("app");
  if (app) app.innerHTML = `<div class="card" style="margin-top:40px"><b style="color:var(--bad-ink)">FORGE hit a problem starting up.</b><p class="t-small" style="margin-top:8px">${esc(e?.message || String(e))}</p><button class="btn btn-secondary" onclick="location.reload()" style="margin-top:12px">Reload</button></div>`;
}
if ("serviceWorker" in navigator && window.self === window.top && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

</script>
