/* ============================================================
   FORGE v2 tokens — "bright & encouraging"
   Mirrors design/forge-design.figcraft (FigCraft Theme collection).
   Station hues validated for protan/deutan/tritan separation (ΔE ≥ 13)
   and every text pair ≥ 4.5:1 (see docs/redesign/research.md).
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #F4F6FA; --surface: #FFFFFF; --surface-2: #EDF1F7; --line: #DDE3EC;
  --ink: #142033; --ink-2: #4A5568; --ink-3: #5F697C;
  --brand: #F2541B; --on-brand: #FFFFFF; --brand-tint: #FFEDE5; --brand-ink: #C2410C;
  --brand-glow: rgba(242, 84, 27, 0.32);
  --bar: #1D5BD6; --bar-tint: #E7EEFC; --bar-ink: #1747A8;
  --dips: #B8286A; --dips-tint: #FBE6EF; --dips-ink: #921F55;
  --knee: #45C6A8; --knee-tint: #DFF6F0; --knee-ink: #0B6E5A;
  --push: #9F80F6; --push-tint: #EFEAFE; --push-ink: #5636C2;
  --floor: #6B7690; --floor-tint: #EEF1F5; --floor-ink: #3F4859;
  --good: #1FA463; --good-tint: #E3F6EC; --good-ink: #0F7442;
  --warn: #F2A71B; --warn-tint: #FEF3DC; --warn-ink: #8F5B00;
  --bad: #E5484D; --bad-tint: #FDE7E7; --bad-ink: #B42328;
  --scrim: rgba(20, 32, 51, 0.42);
  --frame: #C3CAD6; --frame-dim: #E3E8F0;
  --shadow-1: 0 1px 2px rgba(20, 32, 51, 0.05), 0 4px 14px rgba(20, 32, 51, 0.06);
  --shadow-2: 0 2px 4px rgba(20, 32, 51, 0.05), 0 12px 32px rgba(20, 32, 51, 0.10);

  --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-pill: 999px;
  --font-round: ui-rounded, "SF Pro Rounded", "Nunito", "Nunito Sans", system-ui, -apple-system, sans-serif;
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1320; --surface: #1A2233; --surface-2: #232D42; --line: #2E3A52;
    --ink: #EEF2F8; --ink-2: #B5BFD0; --ink-3: #8D99AE;
    --brand: #FF8547; --on-brand: #1F0E04; --brand-tint: #3A2418; --brand-ink: #FFB088;
    --brand-glow: rgba(255, 133, 71, 0.28);
    --bar: #3D7BFF; --bar-tint: #1C2B4D; --bar-ink: #9DBBFF;
    --dips: #C93C8C; --dips-tint: #3A1B2D; --dips-ink: #F49AC8;
    --knee: #63DCC0; --knee-tint: #15332E; --knee-ink: #8FEBD6;
    --push: #B9A0FF; --push-tint: #2A2547; --push-ink: #D3C5FF;
    --floor: #8B96AD; --floor-tint: #262E3F; --floor-ink: #C3CAD8;
    --good: #3CCB7F; --good-tint: #163326; --good-ink: #8CE5B3;
    --warn: #F5B83D; --warn-tint: #3A2E14; --warn-ink: #F8CF7A;
    --bad: #FF6B6B; --bad-tint: #3A1C1F; --bad-ink: #FFA3A3;
    --scrim: rgba(0, 0, 0, 0.6);
    --frame: #3A4660; --frame-dim: #262F42;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-2: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1320; --surface: #1A2233; --surface-2: #232D42; --line: #2E3A52;
  --ink: #EEF2F8; --ink-2: #B5BFD0; --ink-3: #8D99AE;
  --brand: #FF8547; --on-brand: #1F0E04; --brand-tint: #3A2418; --brand-ink: #FFB088;
  --brand-glow: rgba(255, 133, 71, 0.28);
  --bar: #3D7BFF; --bar-tint: #1C2B4D; --bar-ink: #9DBBFF;
  --dips: #C93C8C; --dips-tint: #3A1B2D; --dips-ink: #F49AC8;
  --knee: #63DCC0; --knee-tint: #15332E; --knee-ink: #8FEBD6;
  --push: #B9A0FF; --push-tint: #2A2547; --push-ink: #D3C5FF;
  --floor: #8B96AD; --floor-tint: #262E3F; --floor-ink: #C3CAD8;
  --good: #3CCB7F; --good-tint: #163326; --good-ink: #8CE5B3;
  --warn: #F5B83D; --warn-tint: #3A2E14; --warn-ink: #F8CF7A;
  --bad: #FF6B6B; --bad-tint: #3A1C1F; --bad-ink: #FFA3A3;
  --scrim: rgba(0, 0, 0, 0.6);
  --frame: #3A4660; --frame-dim: #262F42;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, 0.45);
}

/* station scoping: anything with data-st gets --st / --st-tint / --st-ink */
[data-st="bar"]   { --st: var(--bar);   --st-tint: var(--bar-tint);   --st-ink: var(--bar-ink); }
[data-st="dips"]  { --st: var(--dips);  --st-tint: var(--dips-tint);  --st-ink: var(--dips-ink); }
[data-st="knee"]  { --st: var(--knee);  --st-tint: var(--knee-tint);  --st-ink: var(--knee-ink); }
[data-st="push"]  { --st: var(--push);  --st-tint: var(--push-tint);  --st-ink: var(--push-ink); }
[data-st="floor"] { --st: var(--floor); --st-tint: var(--floor-tint); --st-ink: var(--floor-ink); }
[data-tone="good"] { --st: var(--good); --st-tint: var(--good-tint); --st-ink: var(--good-ink); }
[data-tone="warn"] { --st: var(--warn); --st-tint: var(--warn-tint); --st-ink: var(--warn-ink); }
[data-tone="bad"]  { --st: var(--bad);  --st-tint: var(--bad-tint);  --st-ink: var(--bad-ink); }
[data-tone="brand"]{ --st: var(--brand); --st-tint: var(--brand-tint); --st-ink: var(--brand-ink); }

/* ============================================================
   FORGE v2 — components & screens
   Rule of the system: anything tappable is a filled pill button or a list
   row with a chevron/trailing button. Static info never looks like a button.
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-text); font-size: 17px; line-height: 1.4;
  background: var(--bg); color: var(--ink);
  min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: contain;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 24px; height: 24px; flex-shrink: 0; fill: none; stroke: currentColor; }
svg.i.sm { width: 18px; height: 18px; } svg.i.lg { width: 28px; height: 28px; } svg.i.xl { width: 40px; height: 40px; }

#app { max-width: 560px; margin: 0 auto; padding: calc(18px + var(--safe-t)) 20px calc(110px + var(--safe-b)); }
.screen { display: flex; flex-direction: column; gap: 16px; animation: rise .32s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- type ---------- */
.t-display { font-family: var(--font-round); font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -0.01em; text-wrap: balance; }
.t-title   { font-family: var(--font-round); font-weight: 800; font-size: 28px; line-height: 1.12; text-wrap: balance; }
.t-head    { font-family: var(--font-round); font-weight: 750; font-size: 20px; line-height: 1.25; text-wrap: balance; }
.t-body    { font-size: 17px; line-height: 1.42; color: var(--ink-2); }
.t-strong  { font-family: var(--font-round); font-weight: 700; font-size: 17px; line-height: 1.3; }
.t-small   { font-size: 15px; line-height: 1.38; color: var(--ink-3); }
.t-cap     { font-family: var(--font-round); font-weight: 700; font-size: 13px; line-height: 1.3; color: var(--ink-3); }
.t-num     { font-family: var(--font-round); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.muted { color: var(--ink-3); } .ink2 { color: var(--ink-2); }

/* ---------- layout ---------- */
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.grid-2 > .btn { padding: 0 8px; font-size: 16px; gap: 6px; white-space: nowrap; }
@media (max-width: 359px) { .grid-2 > .btn { white-space: normal; font-size: 15px; } }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-1); }
.card.hero { border-radius: var(--r-xl); padding: 20px; box-shadow: var(--shadow-2); display: flex; flex-direction: column; gap: 16px; }
.card.flat { box-shadow: none; background: var(--surface-2); }
.card.tint { background: var(--st-tint); box-shadow: none; }
.section-title { font-family: var(--font-round); font-weight: 750; font-size: 20px; margin: 8px 2px -4px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 20px; border-radius: var(--r-pill);
  font-family: var(--font-round); font-weight: 700; font-size: 17px; line-height: 1.15;
  transition: transform .12s ease, filter .12s ease, background-color .2s;
  user-select: none; -webkit-user-select: none; text-align: center;
}
.btn:active { transform: scale(0.97); }
.btn.block { display: flex; width: 100%; }
.btn-primary { background: var(--brand); color: var(--on-brand); min-height: 60px; font-size: 19px; font-weight: 800; box-shadow: 0 8px 22px var(--brand-glow); }
.btn-primary:active { filter: brightness(1.06); }
.btn-secondary { background: var(--surface-2); color: var(--ink); }
.btn-tinted { background: var(--st-tint, var(--brand-tint)); color: var(--st-ink, var(--brand-ink)); }
.btn-outline { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.btn-text { background: transparent; color: var(--brand-ink); min-height: 44px; padding: 0 10px; }
.btn-danger { background: var(--bad-tint); color: var(--bad-ink); }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 15px; }
.btn-icon { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; background: var(--surface-2); color: var(--ink); }
.btn[disabled], .btn.locked { opacity: .5; pointer-events: none; box-shadow: none; }
.btn .sub { font-weight: 600; font-size: 13px; opacity: .85; display: block; }

/* tall choice buttons (back check-in, feedback) */
.choice {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  min-height: 86px; padding: 14px 8px; border-radius: var(--r-md);
  background: var(--st-tint); color: var(--st-ink);
  font-family: var(--font-round); font-weight: 750; font-size: 16px; text-align: center;
  box-shadow: inset 0 0 0 2px transparent; transition: transform .12s, box-shadow .15s;
}
.choice:active { transform: scale(0.96); }
.choice .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--st); }
.choice.sel { box-shadow: inset 0 0 0 3px var(--st); }
.choice.compact { min-height: 56px; flex-direction: row; gap: 8px; }

/* ---------- chips (static info — never buttons) ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px;
  border-radius: 10px; background: var(--st-tint, var(--surface-2)); color: var(--st-ink, var(--ink-2));
  font-family: var(--font-round); font-weight: 700; font-size: 13px; line-height: 1.2;
}
.chip svg.i { width: 18px; height: 18px; }

/* ---------- list rows ---------- */
.list { background: var(--surface); border-radius: var(--r-lg); padding: 2px 16px; box-shadow: var(--shadow-1); }
.list-row { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 0; width: 100%; }
a.list-row { color: inherit; text-decoration: none; }
.list-row + .list-row { border-top: 1px solid var(--line); }
button.list-row:active { opacity: .7; }
.list-row .chev { color: var(--ink-3); width: 18px; height: 18px; }
.tile { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0;
  background: var(--st-tint, var(--surface-2)); color: var(--st-ink, var(--ink-2)); }
.tile.lg { width: 56px; height: 56px; border-radius: 18px; }
.tile.done { background: var(--good-tint); color: var(--good-ink); }
.badge-done { display: inline-flex; align-items: center; gap: 4px; color: var(--good-ink); font-family: var(--font-round); font-weight: 700; font-size: 15px; }

/* ---------- header / ring ---------- */
.today-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
.ring-wrap { display: flex; align-items: center; gap: 8px; }
.ring { width: 56px; height: 56px; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-2); }
.ring .fill { stroke: var(--brand); transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
.ring.big { width: 132px; height: 132px; }

/* ---------- notices ---------- */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md);
  background: var(--st-tint, var(--surface-2)); color: var(--st-ink, var(--ink-2)); font-size: 15px; line-height: 1.4; }
.notice svg.i { margin-top: 1px; }
.notice b { font-family: var(--font-round); }

/* ---------- tab bar ---------- */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid var(--line); }
#nav .inner { max-width: 560px; margin: 0 auto; display: flex; padding: 6px 8px calc(6px + var(--safe-b)); }
#nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0;
  color: var(--ink-3); font-family: var(--font-round); font-weight: 700; font-size: 11px; min-height: 52px; }
#nav button svg.i { width: 26px; height: 26px; }
#nav button.active { color: var(--brand-ink); }
#nav button.active svg.i { color: var(--brand); }

/* ---------- sheet ---------- */
.sheet-backdrop { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--bg);
  border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 8px 20px calc(24px + var(--safe-b));
  display: flex; flex-direction: column; gap: 14px; animation: up .28s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 0; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.option { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--r-lg); background: var(--surface);
  box-shadow: inset 0 0 0 2px var(--line); width: 100%; text-align: left; }
.option.sel { box-shadow: inset 0 0 0 3px var(--brand); }
.option .radio { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); flex-shrink: 0; margin-top: 1px; }
.option.sel .radio { box-shadow: inset 0 0 0 7px var(--brand); }
.option.locked { opacity: .75; }
.pill-note { display: inline-flex; padding: 4px 10px; border-radius: var(--r-pill); background: var(--good-tint); color: var(--good-ink);
  font-family: var(--font-round); font-weight: 700; font-size: 13px; margin-top: 6px; }

/* ---------- form controls ---------- */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > .t-cap { padding-left: 2px; }
input[type="text"], input[type="number"], input[type="time"], select, textarea {
  width: 100%; min-height: 50px; padding: 12px 14px; border-radius: var(--r-md); border: 0;
  background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); font-size: 17px; -webkit-appearance: none; appearance: none;
}
input:focus, select:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--brand); }
.seg { display: flex; padding: 4px; gap: 4px; border-radius: var(--r-pill); background: var(--surface-2); }
.seg button { flex: 1; min-height: 40px; border-radius: var(--r-pill); font-family: var(--font-round); font-weight: 700; font-size: 15px; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.days button { min-height: 46px; border-radius: 14px; background: var(--surface-2); color: var(--ink-2);
  font-family: var(--font-round); font-weight: 800; font-size: 14px; }
.days button.on { background: var(--brand); color: var(--on-brand); }
.toggle { position: relative; width: 52px; height: 32px; flex-shrink: 0; }
.toggle input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle .tr { position: absolute; inset: 0; border-radius: 16px; background: var(--line); transition: background .2s; }
.toggle .th { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.toggle input:checked ~ .tr { background: var(--good); }
.toggle input:checked ~ .th { transform: translateX(20px); }

/* ---------- player ---------- */
#player { position: fixed; inset: 0; z-index: 50; background: var(--surface); overflow-y: auto; overflow-x: hidden; touch-action: pan-y; }
#player .inner { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 14px;
  padding: calc(12px + var(--safe-t)) 20px calc(20px + var(--safe-b)); }
.p-top { display: flex; align-items: center; gap: 10px; }
.segments { flex: 1; display: flex; gap: 4px; }
.segments i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.segments i.done { background: var(--brand); }
.segments i.part { background: color-mix(in srgb, var(--brand) 55%, var(--line)); }
.segments i.now { transform: scaleY(1.7); box-shadow: inset 0 0 0 1.5px var(--brand); }
#player .inner.in-next { animation: in-next .2s ease-out; }
#player .inner.in-prev { animation: in-prev .2s ease-out; }
@keyframes in-next { from { transform: translateX(36%); opacity: 0; } }
@keyframes in-prev { from { transform: translateX(-36%); opacity: 0; } }
.hurt-btn { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 10px; border-radius: var(--r-pill);
  background: var(--bad-tint); color: var(--bad-ink); font-family: var(--font-round); font-weight: 700; font-size: 13px; }
.station-line { display: flex; align-items: center; gap: 12px; }
.mini-tower { width: 48px; height: 84px; flex-shrink: 0; }
.demo { position: relative; border-radius: var(--r-xl); background: var(--st-tint); display: grid; place-items: center;
  min-height: 230px; overflow: hidden; }
.demo video, .demo img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.demo .warm-tag { position: absolute; left: 12px; top: 12px; }
.target { display: flex; align-items: center; gap: 14px; }
.target .t-num { font-size: 96px; letter-spacing: -0.03em; }
.set-dots { display: flex; gap: 6px; }
.set-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.set-dots i.done { background: var(--good); } .set-dots i.now { background: var(--brand); }
.p-actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.tertiary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tertiary button { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 60px; padding: 8px 0;
  border-radius: var(--r-md); color: var(--ink-2); font-family: var(--font-round); font-weight: 700; font-size: 13px; }
.tertiary button:active { background: var(--surface-2); }
.stepper { display: flex; align-items: center; justify-content: center; gap: 22px; }
.stepper button { width: 64px; height: 64px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
.stepper .t-num { font-size: 64px; min-width: 100px; text-align: center; }
.hold { display: grid; place-items: center; position: relative; }
.hold svg { width: 220px; height: 220px; transform: rotate(-90deg); }
.hold .val { position: absolute; font-size: 64px; }

/* rest */
#rest { position: fixed; inset: 0; z-index: 60; background: var(--st-tint, var(--bg)); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 22px; padding: 24px 20px calc(24px + var(--safe-b)); animation: fade .2s; }
#rest .clock { font-size: 112px; color: var(--st-ink, var(--ink)); }
#rest .clock.ending { color: var(--brand); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.05); } }
#rest .next { width: 100%; max-width: 420px; }

/* 3-2-1 before the first move */
#countdown { position: fixed; inset: 0; z-index: 70; background: var(--st-tint, var(--bg)); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; animation: fade .2s; cursor: pointer; }
#countdown .n { font-size: 168px; font-weight: 800; line-height: 1; color: var(--st-ink, var(--ink)); animation: pop .9s ease-out both; }
#countdown .n.go { color: var(--brand); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } 30% { transform: scale(1.08); opacity: 1; } to { transform: scale(1); } }

/* ---------- done / celebration ---------- */
.done-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 18px; }
.done-hero .burst { width: 160px; height: 160px; }
.confetti { position: fixed; z-index: 90; top: -12px; pointer-events: none; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

/* ---------- progress ---------- */
.big-ring { display: flex; align-items: center; gap: 18px; }
.big-ring .center { position: relative; display: grid; place-items: center; }
.big-ring .center .t-num { position: absolute; font-size: 34px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .t-num { font-size: 26px; }
.unlock-bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.unlock-bar i { display: block; height: 100%; border-radius: 5px; background: var(--st, var(--brand)); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .dow { text-align: center; font-family: var(--font-round); font-weight: 700; font-size: 11px; color: var(--ink-3); }
.cal .d { aspect-ratio: 1; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center;
  font-family: var(--font-round); font-weight: 700; font-size: 13px; color: var(--ink-3); }
.cal .d.s { background: var(--brand); color: var(--on-brand); }
.cal .d.l { background: var(--brand-tint); color: var(--brand-ink); }
.cal .d.p { background: var(--bad-tint); color: var(--bad-ink); }
.cal .d.f { background: var(--bar-tint); color: var(--bar-ink); }
.cal .d.today { box-shadow: inset 0 0 0 2px var(--ink); }
.cal .d.empty { background: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); font-family: var(--font-round); font-weight: 700; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-family: var(--font-round);
  font-weight: 700; font-size: 11px; color: var(--ink-3); }
.badge .med { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); }
.badge.got .med { background: var(--brand); color: var(--on-brand); box-shadow: 0 6px 16px var(--brand-glow); }
.badge.got { color: var(--ink); }

/* ---------- moves / tower ---------- */
.tower-photo { position: relative; margin: 0 auto; flex-shrink: 0; width: min(100%, 39vh); border-radius: var(--r-lg); overflow: hidden; background: var(--surface-2); }
.tower-photo img { display: block; width: 100%; height: auto; }
.tower-photo .pin { position: absolute; transform: translate(-50%, -50%); background: var(--st-tint); color: var(--st-ink);
  box-shadow: 0 2px 10px rgba(0, 0, 0, .25), inset 0 0 0 2px var(--st); white-space: nowrap; pointer-events: none; }
details.drawing summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.drawing summary::after { content: "Show"; color: var(--brand-ink); font-weight: 700; }
details.drawing[open] summary::after { content: "Hide"; }
.tower-map { position: relative; display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
.tower-map svg.tower { width: 150px; height: auto; }
svg.tower .s { stroke: var(--sc); transition: stroke .25s; }
svg.tower .f { fill: var(--sc); transition: fill .25s; }
svg.tower .tw-frame { --sc: var(--frame); }
svg.tower .tw-bar { --sc: var(--bar); } svg.tower .tw-dips { --sc: var(--dips); } svg.tower .tw-knee { --sc: var(--knee); }
svg.tower .tw-push { --sc: var(--push); } svg.tower .tw-floor { --sc: var(--floor); }
svg.tower .dim { --sc: var(--frame-dim); }
.mini-tower svg.tower { width: 48px; height: 84px; }
.station-list { display: flex; flex-direction: column; gap: 8px; }
.station-btn { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px 8px 8px; border-radius: var(--r-md);
  background: var(--st-tint); color: var(--st-ink); font-family: var(--font-round); font-weight: 700; font-size: 15px; width: 100%; }
.station-btn .tile { width: 36px; height: 36px; border-radius: 11px; background: var(--surface); }
.station-btn .count { margin-left: auto; font-size: 13px; opacity: .8; }
.search { position: relative; }
.search svg.i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { padding-left: 44px; }
.ladder { display: flex; flex-direction: column; }
.rung { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; position: relative; }
.rung .pip { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); flex-shrink: 0; display: grid; place-items: center; z-index: 1; color: var(--ink-3); }
.rung.done .pip { background: var(--good); color: #fff; }
.rung.now .pip { background: var(--brand); color: var(--on-brand); box-shadow: 0 0 0 5px var(--brand-tint); }
.rung:not(:last-child)::before { content: ""; position: absolute; left: 10px; top: 30px; bottom: -8px; width: 2px; background: var(--line); }

/* ---------- onboarding ---------- */
.ob { display: flex; flex-direction: column; gap: 18px; min-height: calc(100dvh - 60px); }
.ob .foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.ob-progress { display: flex; gap: 6px; }
.ob-progress i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.ob-progress i.on { background: var(--brand); }
.brand-lockup { height: 30px; width: auto; display: block; color: var(--ink); }
.brand-mark { width: 100%; height: 100%; display: block; color: var(--ink); }
.ob-art { width: 120px; height: 120px; margin: 4px auto 0; }

/* ---------- toast ---------- */
#toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%); z-index: 95;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: var(--r-pill); max-width: calc(100vw - 40px);
  font-family: var(--font-round); font-weight: 700; font-size: 15px; box-shadow: var(--shadow-2); animation: up .25s; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Station line for the player: where to go + the setting that matters. */
function stationHint(st) {
  if (st === "bar") {
    const s = S.profile?.barSetting;
    return s ? `Bar on setting ${s} (${(barHeightMm(s) / 10).toFixed(0)} cm) · use the angled ends` : "Use the angled ends · strict, no swinging";
  }
  return { dips: "Legs still — the tower wobbles if you swing", knee: "Back flat on the pad, zero swing",
           push: "Hands on the front-foot grips, body one straight line", floor: "In front of the tower, no equipment needed" }[st];
}

/* Weekly tower care (owner feedback: grips loosen, bolts back off). */
function towerCheckDue() {
  const last = S.towerCheck || S.createdAt;
  return (new Date(todayKey()) - new Date(last)) / 864e5 >= 7;

const DEMO_SIDE_OFFSET = [4, 2];
function demoFlat(p) {
  const o = DEMO_SIDE_OFFSET;
  const d2 = (a, b) => p[a] ? p[a] : [p[b][0] + o[0], p[b][1] + o[1]];
  return [p.hd, p.nk, p.hp, p.el, p.ha, d2("el2", "el"), d2("ha2", "ha"), p.kn, p.an, d2("kn2", "kn"), d2("an2", "an")];
}

let demoRAF = null;
function stopDemo() { if (demoRAF) { cancelAnimationFrame(demoRAF); demoRAF = null; } }

function mountDemo(container, exId, size) {
  const id = DEMO_MAP[exId];
  const demo = id && DEMOS[id];
  if (!demo || !container) return false;
  const w = size || 168;
  container.innerHTML = `
    <svg viewBox="0 0 120 100" width="${w}" height="${Math.round(w * 100 / 120)}" style="display:block">
      <g stroke="var(--ink-3)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.45">${demo.props.join("")}</g>
      <g id="d-far" stroke="var(--st, var(--ink-3))" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55">
        <path id="d-armB" /><path id="d-legB" />
      </g>
      <g stroke="var(--st-ink, var(--ink))" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path id="d-torso" /><path id="d-armA" /><path id="d-legA" />
      </g>
      <circle id="d-head" r="5.8" fill="var(--st-ink, var(--ink))" />
    </svg>`;
  const el = (i) => container.querySelector("#" + i);
  const parts = { head: el("d-head"), torso: el("d-torso"), armA: el("d-armA"), armB: el("d-armB"), legA: el("d-legA"), legB: el("d-legB") };
  const flats = demo.poses.map(demoFlat);
  const draw = (pose) => {
    const [hd, nk, hp, elA, haA, elB, haB, knA, anA, knB, anB] = pose;
    parts.head.setAttribute("cx", hd[0]); parts.head.setAttribute("cy", hd[1]);
    parts.torso.setAttribute("d", `M${nk[0]},${nk[1]} L${hp[0]},${hp[1]}`);
    parts.armA.setAttribute("d", `M${nk[0]},${nk[1]} L${elA[0]},${elA[1]} L${haA[0]},${haA[1]}`);
    parts.armB.setAttribute("d", `M${nk[0]},${nk[1]} L${elB[0]},${elB[1]} L${haB[0]},${haB[1]}`);
    parts.legA.setAttribute("d", `M${hp[0]},${hp[1]} L${knA[0]},${knA[1]} L${anA[0]},${anA[1]}`);
    parts.legB.setAttribute("d", `M${hp[0]},${hp[1]} L${knB[0]},${knB[1]} L${anB[0]},${anB[1]}`);
  };
  const lerp = (a, b, t) => a.map((pt, i) => [pt[0] + (b[i][0] - pt[0]) * t, pt[1] + (b[i][1] - pt[1]) * t]);
  const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  let reduced = false;
  try { reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (_) {}
  if (reduced || flats.length < 2) { draw(flats[flats.length > 1 ? 1 : 0]); return true; }
  stopDemo();
  const seg = demo.dur, hold = 260, cycle = 2 * (seg + hold);
  const t0 = performance.now();
  const tick = (now) => {
    let t = (now - t0) % cycle;
    let pose;
    if (t < seg) pose = lerp(flats[0], flats[1], ease(t / seg));
    else if (t < seg + hold) pose = flats[1];
    else if (t < 2 * seg + hold) pose = lerp(flats[1], flats[0], ease((t - seg - hold) / seg));
    else pose = flats[0];
    draw(pose);
    demoRAF = requestAnimationFrame(tick);
  };
  demoRAF = requestAnimationFrame(tick);
  return true;
}

const GUARD = {
  STRENGTH_GAP_H: 6,        // between two full strength sessions (Baar ~6 h tissue reset; AM/PM studies)
  SPLIT_GAP_H: 4,           // suggested (soft) gap between split halves
  SAME_PATTERN_BLOCK_H: 24, // same pattern hard again (MPS/recovery)
  SAME_PATTERN_WARN_H: 48,
  DAY_HARD_WARN: 20, DAY_HARD_BLOCK: 26,
  PATTERN_DAY_WARN: 8, PATTERN_DAY_BLOCK: 10,
  WEEK_PATTERN_WARN: 20,    // hard sets per pattern per rolling week (Schoenfeld 10–20)
  WEEK_HARD_DAYS: 5,        // ≥1 full rest day from hard sets
  SPINE_MAX_DAY: 3, SPINE_GAP_H: 2,
  WAKE_BLOCK_MIN: 60, WAKE_WARN_MIN: 120,
};
const H = 3600e3;

/* Hard sets a log contributed, per pattern (cached on the log; v1 logs computed from sets). */
function hardOf(l) {
  if (l.hard) return l.hard;
  const h = {};
  if (l.type === "strength" || l.type === "quick" || l.type === "rescue") {
    for (const s of l.sets || []) {
      const gp = EX[s.ex]?.gp;
      if (gp && s.val > 0) h[gp] = (h[gp] || 0) + 1;
    }
  }
  return h;
}
const hardTotal = (h) => Object.values(h).reduce((a, b) => a + b, 0);
function plannedHard(items) {
  const h = {};
  for (const it of items) if (!it.warmup && it.ex.gp) h[it.ex.gp] = (h[it.ex.gp] || 0) + it.sets;
  return h;
}
const isStrengthLog = (l) => l.type === "strength";
const strengthToday = () => sessionsOn(todayKey()).filter(isStrengthLog);

/* Minutes since the user's usual wake time. Night (more than 3 h before wake) = not morning. */
function minsSinceWake(now = new Date()) {
  const [h, m] = (S.profile?.wake || "07:00").split(":").map(Number);
  const d = now.getHours() * 60 + now.getMinutes() - (h * 60 + m);
  if (d < -180) return 9999;
  return Math.max(0, d);
}
const wakeTime = (plusMin) => {
  const [h, m] = (S.profile?.wake || "07:00").split(":").map(Number);
  const d = new Date(); d.setHours(h, m + plusMin, 0, 0); return d.getTime();
};
const fmtTime = (ts) => new Date(ts).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
// "Ready at 4:30." — or, when that lands after 10pm or tomorrow, point at tomorrow instead of a 3am time
const readyWhen = (ts) => {
  const d = new Date(ts);
  return tooLate(ts) ? "Not tonight — next one tomorrow." : `Ready at ${fmtTime(ts)}.`;
};
const tooLate = (ts) => { const d = new Date(ts); return d.toDateString() !== new Date().toDateString() || d.getHours() >= 22; };
// split halves are one day's work, so a late part 1 just shortens the break instead of pushing part 2 past midnight
const part2When = (ts) => (tooLate(ts) ? "It's getting late, so take a shorter break before part 2" : `Part 2 is best after ${fmtTime(ts)}`);

/* Rolling-window sums */
function hardSince(sinceTs, exclude) {
  const out = {};
  for (const l of S.log) {
    if ((l.ts || 0) < sinceTs || (exclude && exclude(l))) continue;
    for (const [k, v] of Object.entries(hardOf(l))) out[k] = (out[k] || 0) + v;
  }
  return out;
}
function lastHardTs(gp, exclude) {
  let t = 0;
  for (const l of S.log) if (!(exclude && exclude(l)) && (hardOf(l)[gp] || 0) > 0) t = Math.max(t, l.ts || 0);
  return t;
}
function hardDaysLast7(excludeToday) {
  const days = new Set();
  const since = Date.now() - 7 * 24 * H;
  for (const l of S.log) if ((l.ts || 0) >= since && hardTotal(hardOf(l)) > 0 && !(excludeToday && l.date === todayKey())) days.add(l.date);
  return days.size;
}

/* The core check. plan = {items, dayType, part (1|2|null), quick}.
   → {level: "ok"|"warn"|"block", notes: [{level, text, why}], availableAt, alt: [...]} */
function checkStrength(plan) {
  const now = Date.now();
  const notes = [];
  let availableAt = 0;
  const add = (level, text, why, at) => { notes.push({ level, text, why }); if (at) availableAt = Math.max(availableAt, at); };
  const pain = painToday();
  const tpl = plan.dayType ? DAY_TEMPLATES[plan.dayType] : null;

  if (pain === "red") add("block", "Rough back day — strength is paused today.", "Training through a flare-up slows recovery. Spine Reset and a gentle walk are today's medicine.");
  if (S.phase === 1) add("block", "Phase 1 is about calming your back first.", "Strength unlocks in Phase 2 — the gate is in Me › Your plan.");

  const msw = minsSinceWake();
  if (msw < GUARD.WAKE_BLOCK_MIN) add("block", `You're within an hour of waking (usual wake ${S.profile?.wake || "07:00"}).`,
    "Discs are fuller first thing, so bending stress is up to ~3× higher (Adams 1987). Walk first, train a bit later.", wakeTime(GUARD.WAKE_BLOCK_MIN));
  else if (msw < GUARD.WAKE_WARN_MIN) add("warn", "Still early — keep every rep smooth today.",
    "Discs are still extra-sensitive in the first couple of hours after waking.");

  // same-day split sibling (part 1 ↔ part 2 of the same template) is one day's work, not a repeat
  const sibling = (l) => plan.part && l.date === todayKey() && l.dayType === plan.dayType && l.part && l.part !== plan.part;
  const planned = plannedHard(plan.items || []);

  for (const gp of Object.keys(planned)) {
    const last = lastHardTs(gp, sibling);
    if (!last) continue;
    const hrs = (now - last) / H;
    if (hrs < GUARD.SAME_PATTERN_BLOCK_H) {
      add("block", `Your ${GP_NAMES[gp]} muscles worked hard ${Math.max(1, Math.round(hrs))} h ago.`,
        "They need about 24 h before working hard again — that's when the strength actually gets built.", last + GUARD.SAME_PATTERN_BLOCK_H * H);
    } else if (hrs < GUARD.SAME_PATTERN_WARN_H && !plan.part) {
      add("warn", `Your ${GP_NAMES[gp]} muscles trained ${Math.round(hrs)} h ago — keep a rep or two in reserve.`,
        "Recovery from a hard set takes 24–48 h; stopping short of failure speeds it up.");
    }
  }

  // second session of the day?
  const todays = strengthToday().filter((l) => !sibling(l));
  const doneFull = todays.filter((l) => !l.part || l.part === 2 || plan.dayType !== l.dayType);
  if (todays.length && !(plan.part === 2 && todays.every((l) => l.dayType === plan.dayType))) {
    if (pain === "yellow") add("block", "Niggly back days get one strength session, max.", "Keep the rest of today to the Spine Reset and walks.");
    const regions = new Set(todays.map((l) => DAY_TEMPLATES[l.dayType]?.region).filter(Boolean));
    if (tpl && regions.has(tpl.region)) add("block", `You've already trained your ${tpl.region} body today.`,
      "A second session should work the other half of your body.");
    const lastEnd = Math.max(...todays.map((l) => l.ts || 0));
    if (now - lastEnd < GUARD.STRENGTH_GAP_H * H && !plan.part) add("block", "A second session needs 6 hours of breathing room.",
      "Muscles and tendons reset over about 6 h — that's what makes two-a-days safe.", lastEnd + GUARD.STRENGTH_GAP_H * H);
    if (doneFull.length >= 2) add("block", "That's two strength sessions today already.", "Two is the ceiling — more starts eating into recovery.");
  }
  if (plan.part === 2) {
    const p1 = strengthToday().find((l) => l.dayType === plan.dayType && l.part === 1);
    const at = p1 && p1.ts + GUARD.SPLIT_GAP_H * H;
    if (p1 && now < at) add("warn", `${part2When(at)}.`, tooLate(at)
      ? "Even an hour or two helps, and finishing tonight beats skipping it."
      : "4–6 h between halves gives you a proper breather — but sooner is fine if that's when you've got time.");
  }

  // daily + weekly volume
  const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
  const today = hardSince(dayStart.getTime());
  const dayTotal = hardTotal(today) + hardTotal(planned);
  if (dayTotal > GUARD.DAY_HARD_BLOCK) add("block", `That would be ${dayTotal} hard sets today.`, "Past ~26 the extra work stops helping and starts costing recovery.");
  else if (dayTotal > GUARD.DAY_HARD_WARN) add("warn", `${dayTotal} hard sets today — a big day.`, "Fine occasionally; keep tomorrow easy.");
  for (const [gp, n] of Object.entries(planned)) {
    const tot = (today[gp] || 0) + n;
    if (tot > GUARD.PATTERN_DAY_BLOCK) add("block", `${tot} hard ${GP_NAMES[gp]} sets in one day is too many.`, "Extra sets past ~10 per muscle in a day add nothing measurable.");
    else if (tot > GUARD.PATTERN_DAY_WARN) add("warn", `${tot} hard ${GP_NAMES[gp]} sets today — near the useful limit.`, "Gains flatten out past about 10 sets per muscle per day.");
  }
  const week = hardSince(now - 7 * 24 * H);
  for (const [gp, n] of Object.entries(planned)) {
    const tot = (week[gp] || 0) + n;
    if (tot > GUARD.WEEK_PATTERN_WARN) add("warn", `${tot} hard ${GP_NAMES[gp]} sets this week — above the 10–20 sweet spot.`, "More weekly volume has diminishing returns and raises tendon strain.");
  }
  if (!todays.length && hardDaysLast7(true) >= GUARD.WEEK_HARD_DAYS && !plan.quick)
    add("warn", "This would be a 6th hard day this week.", "At least one full rest day a week is where strength gets built.");

  const level = notes.some((n) => n.level === "block") ? "block" : notes.some((n) => n.level === "warn") ? "warn" : "ok";
  return { level, notes, availableAt: availableAt > now ? availableAt : 0, alt: level === "block" ? ["spine", "walk"] : [] };
}

/* Spine Reset is gentle — only soft nudges. */
function checkSpine() {
  const done = sessionsOn(todayKey()).filter((l) => l.type === "spine");
  const notes = [];
  if (done.length >= GUARD.SPINE_MAX_DAY) notes.push({ level: "warn", text: "That's 3 Spine Resets today already.", why: "Three is plenty — more doesn't add much. A walk is a great alternative." });
  const last = Math.max(0, ...done.map((l) => l.ts || 0));
  if (last && Date.now() - last < GUARD.SPINE_GAP_H * H) notes.push({ level: "warn", text: `Last Reset was ${Math.round((Date.now() - last) / 60000)} min ago.`, why: "Spacing them 2 h+ apart spreads the benefit across your day." });
  return { level: notes.length ? "warn" : "ok", notes };
}

/* Which full session could come second today (the other body region, next in rotation). */
function secondSessionOption() {
  const todays = strengthToday();
  if (!todays.length) return null;
  const used = new Set(todays.map((l) => DAY_TEMPLATES[l.dayType]?.region).filter(Boolean));
  const order = DAY_ORDER.slice(DAY_ORDER.indexOf(nextDayType())).concat(DAY_ORDER);
  const dayType = order.find((d) => !used.has(DAY_TEMPLATES[d].region));
  if (!dayType) return null;
  const w = buildWorkout(dayType, painToday() || "green");
  return { dayType, check: checkStrength({ items: w.items, dayType }) };
}

/* Deload: every ~6 weeks of steady training, or when recovery signals pile up. */
function deloadActive() {
  return S.deload && (new Date(todayKey()) - new Date(S.deload)) / 864e5 < 7;
}
function deloadSuggestion() {
  if (deloadActive() || S.deloadDismissed === todayKey()) return null;
  const since = Date.now() - 7 * 24 * H;
  const rough = S.log.filter((l) => (l.ts || 0) >= since && (l.back === "worse" || l.rpe === "hard")).length;
  if (rough >= 3) return "Your last few sessions felt rough. A lighter week now means stronger weeks after.";
  // consecutive training weeks (≥3 strength sessions) since the last deload
  let weeks = 0;
  for (let w = 1; w <= 12; w++) {
    const end = Date.now() - (w - 1) * 7 * 24 * H, start = end - 7 * 24 * H;
    if (S.deload && new Date(S.deload).getTime() >= start) break;
    const n = S.log.filter((l) => isStrengthLog(l) && l.ts >= start && l.ts < end).length;
    if (n >= 3) weeks++; else break;
  }
  if (weeks >= 6) return `${weeks} strong weeks in a row. Time for a lighter week so your body can catch up.`;
  return null;
}

/* ============================================================
   FORGE — core engine
   Store, streak engine (silent freezes + repair), XP,
   pain-adaptive workout generation, ICS export, audio, wake lock.
   ============================================================ */

"use strict";

/* ---------- date utils (all local time) ---------- */
const dkey = (d = new Date()) => {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const dayShift = (key, delta) => {
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d + delta);
  return dkey(dt);
};
const todayKey = () => dkey(new Date());
const fmtDate = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
};
const fmtMins = (s) => s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${s}s`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- store ---------- */
const STORE_KEY = "forge.v1";

const defaultState = () => ({
  v: 2,
  profile: null, // set by onboarding
  levels: { vpull: 0, hpull: 0, dip: 0, push: 0, vpush: 0, vkr: 0, lsit: 0, squat: 0, hinge: 0 },
  targets: {},   // per-ladder current rep/sec goal within the rung's window
  phase: 2,
  pain: {},      // date -> 'green' | 'yellow' | 'red'
  log: [],       // {id, date, ts, type, name, mins, sets:[{ex,val,target,kind}], xp}
  prs: {},       // exId -> best val
  xp: 0,
  streak: { current: 0, best: 0, freezes: 0, frozen: {}, lastRepair: null, earnedAt: 0 },
  badges: [],
  weights: [],   // {date, kg}
  settings: { sound: true, restMain: 120, restAcc: 75, restSpine: 25, alertMin: 15, theme: "auto" },
  seenGuide: false,
  createdAt: todayKey(),
  plans: {},         // date -> {mode: "one"|"split", dayType?: a session swapped in for today}
  active: null,      // in-progress session (resume after interruption)
  towerCheck: null,  // date of last bolt check
  deload: null,      // start date of a lighter week
  deloadDismissed: null,
  seenV2: false,
  seenSwipe: false,  // one-time "swipe between moves" tip
});

let S = defaultState();
let storageOK = true;
let RESCUE_RAW = null; // unparseable previous store, kept OUT of S so it's never re-saved

/* Deep-validate an untrusted state object (imported backup or stored JSON).
   Builds a fresh state and copies only well-typed values, clamping ranges.
   Throws if it isn't a v1 FORGE state at all. */
const isDateKey = (x) => typeof x === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x);
const numOr = (x, d, lo = -Infinity, hi = Infinity) =>
  typeof x === "number" && isFinite(x) ? Math.min(hi, Math.max(lo, x)) : d;
const strOr = (x, d, max = 200) => (typeof x === "string" ? x.slice(0, max) : d);
function sanitizeState(p) {
  if (!p || typeof p !== "object" || (p.v !== 1 && p.v !== 2) || !("log" in p)) throw new Error("Not a FORGE state");
  const s = defaultState();
  if (p.profile && typeof p.profile === "object") {
    const pr = p.profile;
    const days = Array.isArray(pr.trainDays) ? [...new Set(pr.trainDays.filter((n) => Number.isInteger(n) && n >= 0 && n <= 6))].sort() : [];
    s.profile = {
      trainDays: days.length ? days : [1, 2, 4, 5],
      time: /^\d{2}:\d{2}$/.test(pr.time) ? pr.time : "18:00",
      anchor: strOr(pr.anchor, "", 120),
      legs: !!pr.legs,
      created: isDateKey(pr.created) ? pr.created : todayKey(),
      wake: /^\d{2}:\d{2}$/.test(pr.wake) ? pr.wake : "07:00",
      weeklyTarget: Math.round(numOr(pr.weeklyTarget, Math.min(5, days.length || 4), 1, 7)),
      barSetting: Number.isInteger(pr.barSetting) && pr.barSetting >= 1 && pr.barSetting <= 9 ? pr.barSetting : null,
    };
  }
  for (const k of Object.keys(s.levels)) {
    s.levels[k] = Math.round(numOr(p.levels?.[k], 0, 0, LADDERS[k].rungs.length - 1));
  }
  if (p.targets && typeof p.targets === "object") {
    for (const [k, v] of Object.entries(p.targets)) {
      if (typeof k === "string" && k.length < 24 && typeof v === "number" && isFinite(v)) s.targets[k] = Math.round(Math.max(0, Math.min(600, v)));
    }
  }
  s.phase = Math.round(numOr(p.phase, 2, 1, 4));
  if (p.pain && typeof p.pain === "object") {
    for (const [k, v] of Object.entries(p.pain)) if (isDateKey(k) && ["green", "yellow", "red"].includes(v)) s.pain[k] = v;
  }
  if (Array.isArray(p.log)) {
    s.log = p.log.filter((l) => l && typeof l === "object" && isDateKey(l.date)).map((l) => ({
      id: strOr(l.id, uid(), 40), date: l.date, ts: numOr(l.ts, 0),
      type: ["strength", "spine", "rescue", "walk", "quick"].includes(l.type) ? l.type : "walk",
      name: strOr(l.name, "Session", 80), mins: Math.round(numOr(l.mins, 1, 0, 600)),
      sets: Array.isArray(l.sets) ? l.sets.filter((x) => x && typeof x === "object").slice(0, 200).map((x) => ({
        ex: strOr(x.ex, "", 30), val: numOr(x.val, 0, 0, 6000), target: numOr(x.target, 0, 0, 6000), kind: strOr(x.kind, "reps", 10),
      })) : [],
      xp: Math.round(numOr(l.xp, 0, 0, 10000)), main: l.main !== false,
      dayType: DAY_TEMPLATES[l.dayType] ? l.dayType
        : l.type === "strength" ? Object.keys(DAY_TEMPLATES).find((d) => String(l.name).startsWith(DAY_TEMPLATES[d].name)) : undefined,
      part: l.part === 1 || l.part === 2 ? l.part : undefined,
      rpe: ["easy", "right", "hard"].includes(l.rpe) ? l.rpe : undefined,
      back: ["ok", "worse"].includes(l.back) ? l.back : undefined,
    }));
  }
  if (p.prs && typeof p.prs === "object") {
    for (const [k, v] of Object.entries(p.prs)) if (k in EX && typeof v === "number" && isFinite(v)) s.prs[k] = Math.max(0, Math.min(6000, v));
  }
  s.xp = Math.round(numOr(p.xp, 0, 0, 1e9));
  const st = p.streak && typeof p.streak === "object" ? p.streak : {};
  s.streak = {
    current: Math.round(numOr(st.current, 0, 0, 100000)), best: Math.round(numOr(st.best, 0, 0, 100000)),
    freezes: Math.round(numOr(st.freezes, 0, 0, 2)), frozen: {},
    lastRepair: isDateKey(st.lastRepair) ? st.lastRepair : null, earnedAt: Math.round(numOr(st.earnedAt, 0, 0, 1e6)),
  };
  if (st.frozen && typeof st.frozen === "object") for (const k of Object.keys(st.frozen)) if (isDateKey(k)) s.streak.frozen[k] = true;
  if (Array.isArray(p.badges)) s.badges = p.badges.filter((b) => BADGES.some((x) => x.id === b));
  if (Array.isArray(p.weights)) {
    s.weights = p.weights.filter((w) => w && isDateKey(w.date) && typeof w.kg === "number" && w.kg >= 25 && w.kg <= 350)
      .map((w) => ({ date: w.date, kg: Math.round(w.kg * 10) / 10 })).sort((a, b) => a.date < b.date ? -1 : 1).slice(-500);
  }
  const se = p.settings && typeof p.settings === "object" ? p.settings : {};
  s.settings = {
    sound: se.sound !== false, restMain: Math.round(numOr(se.restMain, 120, 30, 600)),
    restAcc: Math.round(numOr(se.restAcc, 75, 15, 600)), restSpine: Math.round(numOr(se.restSpine, 25, 5, 120)),
    alertMin: Math.round(numOr(se.alertMin, 15, 0, 120)), theme: ["auto", "dark", "light"].includes(se.theme) ? se.theme : "auto",
  };
  s.seenGuide = !!p.seenGuide;
  s.createdAt = isDateKey(p.createdAt) ? p.createdAt : todayKey();
  if (p.plans && typeof p.plans === "object") {
    for (const [k, v] of Object.entries(p.plans)) {
      if (!isDateKey(k) || !v || typeof v !== "object") continue;
      const plan = { mode: ["one", "split"].includes(v.mode) ? v.mode : "one" };
      if (DAY_TEMPLATES[v.dayType]) plan.dayType = v.dayType;
      s.plans[k] = plan;
    }
  }
  s.towerCheck = isDateKey(p.towerCheck) ? p.towerCheck : null;
  s.deload = isDateKey(p.deload) ? p.deload : null;
  s.deloadDismissed = isDateKey(p.deloadDismissed) ? p.deloadDismissed : null;
  s.seenV2 = !!p.seenV2;
  s.seenSwipe = !!p.seenSwipe;
  s.active = sanitizeActive(p.active);
  return s;
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { storageOK = false; }
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { storageOK = false; return; }
  if (!raw) return;
  try { S = sanitizeState(JSON.parse(raw)); }
  catch (e) { RESCUE_RAW = raw; } // corrupt/foreign state: keep for rescue, start fresh
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (_) {}

/* ---------- sessions per day ---------- */
const sessionsOn = (date) => S.log.filter((l) => l.date === date);
const dayCounts = (date) => sessionsOn(date).length > 0; // any completed session counts
const dayPaused = (date) => S.pain[date] === "red";       // a red back day pauses the chain, never breaks it

/* ---------- streak engine: silent freezes + repair window ---------- */
function recomputeStreak() {
  const t = todayKey();
  // earn freezes: 1 per 7 counted days total, max 2 banked
  const totalCounted = new Set(S.log.map((l) => l.date)).size;
  const shouldHaveEarned = Math.floor(totalCounted / 7);
  if (shouldHaveEarned > S.streak.earnedAt) {
    S.streak.freezes = Math.min(2, S.streak.freezes + (shouldHaveEarned - S.streak.earnedAt));
    S.streak.earnedAt = shouldHaveEarned;
  }
  // walk backward from today (today only counts if already done)
  let cur = 0;
  let d = dayCounts(t) ? t : dayShift(t, -1);
  while (true) {
    if (dayCounts(d) || S.streak.frozen[d] || dayPaused(d)) { cur += (dayCounts(d) ? 1 : 0); d = dayShift(d, -1); continue; }
    if (d === t) { d = dayShift(d, -1); continue; }
    // missed day: silently apply a freeze if banked (never for >2 consecutive misses)
    const prevMissed = !dayCounts(dayShift(d, -1)) && !S.streak.frozen[dayShift(d, -1)];
    if (S.streak.freezes > 0 && !prevMissed && d >= S.createdAt) {
      S.streak.freezes--; S.streak.frozen[d] = true; d = dayShift(d, -1); continue;
    }
    break;
  }
  S.streak.current = cur;
  S.streak.best = Math.max(S.streak.best || 0, cur);
  save();
}
/* Repair: if the chain broke in the last 1-2 days, one completed session
   today bridges the gap (24-48h mercy window). Max once per 14 days. */
function repairInfo() {
  const t = todayKey();
  const y1 = dayShift(t, -1), y2 = dayShift(t, -2), y3 = dayShift(t, -3);
  const covered = (d) => dayCounts(d) || S.streak.frozen[d];

function tryRepair() {

}

/* ---------- XP / levels / badges ---------- */
function xpLevel() {
  let lv = 0;
  for (let i = 0; i < LEVELS_XP.length; i++) if (S.xp >= LEVELS_XP[i]) lv = i;
  const cur = LEVELS_XP[lv], next = LEVELS_XP[lv + 1] ?? null;
  return { lv, name: LEVEL_NAMES[lv], cur, next, pct: next ? Math.min(100, Math.round(((S.xp - cur) / (next - cur)) * 100)) : 100 };
}
function checkBadges() {
  const earned = [];
  for (const b of BADGES) if (!S.badges.includes(b.id) && b.test(S)) { S.badges.push(b.id); earned.push(b); }

/* ---------- pain ---------- */
const painToday = () => S.pain[todayKey()] || null;

/* ---------- workout generation ---------- */
function ladderRung(ladderKey) {
  const ladder = LADDERS[ladderKey];

  // clamp to the highest rung allowed by current phase
  while (idx > 0 && EX[ladder.rungs[idx].ex].phase > S.phase) idx--;
  if (EX[ladder.rungs[idx].ex].phase > S.phase) return null; // even rung 0 is phase-locked

function ladderTarget(ladderKey) {

  const tkey = `${ladderKey}:${idx}`;

/* Rotation advances once per completed template: a split day (part 1 + part 2) counts once. */

   is plain A→B→C→D; after a swap, whatever was skipped comes up next instead of being lost. */
function nextDayType() {
  const done = S.log.filter((l) => l.type === "strength" && l.main !== false && l.part !== 1 && DAY_TEMPLATES[l.dayType]);
  if (!done.length) return DAY_ORDER[0];
  const lastAt = {};
  done.forEach((l, i) => { lastAt[l.dayType] = i; });

    .filter((d) => DAY_TEMPLATES[d].region !== DAY_TEMPLATES[prev].region);

/* Today's template: if a split day is underway, stay on it for part 2. */

  if (p1 && !sessionsOn(todayKey()).some((l) => l.dayType === p1.dayType && l.part === 2)) return p1.dayType;
  const pick = S.plans[todayKey()]?.dayType; // swapped in from Today → Change, until it's done

function warmupBlocks(firstMain, dayType, short) {

    const b = [{ ex: "walk", sets: 1, target: 60, warmup: true, label: "1-min march" },
               { ex: "catcamel", sets: 1, target: 6, warmup: true },
               { ex: "birddog", sets: 1, target: 3, warmup: true, label: "3 each side, 8s holds" }];

  }

    { ex: "walk", sets: 1, target: 120, warmup: true, label: "2-min march / easy movement" },
    { ex: "catcamel", sets: 1, target: 8, warmup: true },
    { ex: "curlup", sets: 1, target: 4, warmup: true, label: "4 short holds" },
    { ex: "sideplank", sets: 1, target: 10, warmup: true, label: "10s each side" },
    { ex: "birddog", sets: 1, target: 4, warmup: true, label: "4 each side, 8s holds" },

/* Build a concrete session. pain: green|yellow (red → spine only, handled upstream).
   part: null (whole day) | 1 | 2 (AM/PM split: blocks before tpl.split are part 1).
   Deload weeks cut sets ~40% and never drive progression. */
function buildWorkout(dayType, pain, part = null) {
  const tpl = DAY_TEMPLATES[dayType];
  const lite = pain === "yellow";
  const deload = deloadActive();
  const items = [];
  let firstMain = null;
  tpl.blocks.forEach((b, bi) => {
    if (part === 1 && bi >= tpl.split) return;

    if (lite && b.lite) return;
    if (b.phaseMin && S.phase < b.phaseMin) return;
    if (lite && b.ladder === "vkr") return; // yellow: no knee raises (research §2)
    const cut = (n, min) => Math.max(min, deload ? Math.round(n * 0.6) : n - (lite ? 1 : 0));
    if (b.ladder) {
      const t = ladderTarget(b.ladder);
      if (!t) return; // whole ladder is phase-locked (e.g. Phase 1)
      const ex = EX[t.rung.ex];
      const sets = cut(b.sets ?? t.rung.scheme.sets, 2);
      // "volume"/B-day slots run easier than the stored target and never drive progression
      const target = b.volume || deload ? Math.max(t.win[0], t.target - 2) : t.target;
      const item = { ladder: b.ladder, exId: t.rung.ex, ex, sets, target, tkey: t.tkey, win: t.win, rungIdx: t.idx,
        timed: t.timed, note: b.note, volume: !!b.volume || deload, main: !firstMain };
      if (!firstMain) firstMain = { ex: t.rung.ex, target: Math.max(2, Math.ceil(target / 2)) };
      items.push(item);
    } else {
      const ex = EX[b.ex];

      const timed = ex.kind === "secs" || ex.kind === "secside";

  return { name, tag: tpl.tag, est, type: "strength", dayType, part, lite: lite || deload, deload,
    warmup: warmupBlocks(firstMain, dayType, part === 2), items };
}

/* "Quick version": the minimum dose that still counts — one hard set of each of
   today's main moves after a 1-minute warm-up. Never moves the split rotation. */
function buildQuick(dayType, pain) {
  const full = buildWorkout(dayType, pain);
  const items = full.items.filter((i) => i.ladder).slice(0, 3).map((i) => ({ ...i, sets: 1, main: false, volume: true }));
  return { name: `${DAY_TEMPLATES[dayType].name} · quick`, est: 8, type: "quick", dayType, lite: true,
    warmup: [{ ex: "catcamel", sets: 1, target: 5, warmup: true }, { ex: "birddog", sets: 1, target: 3, warmup: true, label: "3 each side, 8s holds" }],
    items };
}
function buildRoutine(def, type) {
  const items = def.blocks.map((b) => {
    const ex = EX[b.ex];
    const timed = ex.kind === "secs" || ex.kind === "secside";
    return { exId: b.ex, ex, sets: b.sets, target: b.target, timed, note: b.note, pyramid: b.pyramid };
  }).filter((i) => i.ex.phase <= Math.max(S.phase, 1));

/* Progression after a completed strength session.
   Evidence rule: advance only after hitting the target on all sets TWO sessions
   running; then target+1 within the window, or a ladder-up offer at the top.
   Volume (B-day) slots and yellow-day sessions never drive progression. */
function applyProgression(session) {
  const offers = [];
  if (session.lite) return offers;
  for (const it of session.items) {
    if (!it.ladder || it.volume || it.warmup || !it.setLog) continue;
    if (it.setLog.filter((v) => v != null).length < it.sets) continue;
    const okKey = it.tkey + ":ok";
    const allHit = it.setLog.every((v) => v >= it.target);
    if (!allHit) { S.targets[okKey] = 0; continue; }
    const okCount = (S.targets[okKey] || 0) + 1;
    if (okCount < 2) { S.targets[okKey] = okCount; continue; }
    S.targets[okKey] = 0;
    if (it.target < it.win[1]) {
      S.targets[it.tkey] = it.target + 1;
    } else {
      const ladder = LADDERS[it.ladder];
      const builtIdx = it.rungIdx ?? 0;
      // phase-limited (clamped below stored level): the user is boxed by phase, not ability
      if (builtIdx < (S.levels[it.ladder] ?? 0)) continue;
      if (builtIdx < ladder.rungs.length - 1) {
        const nxt = ladder.rungs[builtIdx + 1];
        offers.push({ ladder: it.ladder, from: EX[ladder.rungs[builtIdx].ex].name, to: EX[nxt.ex].name,
          locked: EX[nxt.ex].phase > S.phase, needPhase: EX[nxt.ex].phase });

}
function ladderUp(ladderKey) {
  const ladder = LADDERS[ladderKey];
  const cur = S.levels[ladderKey] ?? 0;

    S.levels[ladderKey] = cur + 1;
    const rung = ladder.rungs[cur + 1];
    const win = rung.scheme.reps || rung.scheme.secs;
    S.targets[`${ladderKey}:${cur + 1}`] = win[0];
    save();
  }
}

/* ---------- finish a session ----------
   Step 1 (completeSession): log it, PRs, XP, streak. Step 2 (finalizeSession): the
   one-tap "how did that feel?" feedback, then progression — a "hard" session or a
   worse back never moves targets up (research: pain-monitoring + RPE rules). */

  tryRepair();

  const sets = [];
  let setCount = 0, prList = [];
  for (const it of session.items) {
    if (!it.setLog || it.warmup) continue; // warm-up work earns nothing and records nothing
    for (const v of it.setLog) {
      if (v == null) continue;
      sets.push({ ex: it.exId, val: v, target: it.target, kind: it.ex.kind });
      setCount++;
      if (!it.ex.kind.includes("side")) {
        if (v > (S.prs[it.exId] || 0) && v >= 3) { S.prs[it.exId] = v; if (session.type === "strength" || session.type === "quick") prList.push({ ex: it.ex.name, val: v, timed: it.timed }); }
      }
    }
  }
  const mainWork = session.type !== "strength" || setCount > 0;
  const xp = (XP_RULES[session.type] || 30) + setCount * XP_RULES.set + prList.length * XP_RULES.pr;
  S.xp += xp;
  const log = { id: uid(), date: todayKey(), ts: Date.now(), type: session.type, name: session.name, mins, sets, xp, main: mainWork };
  if (session.dayType) log.dayType = session.dayType;

  const log = S.log.find((l) => l.id === logId);
  if (log) { if (rpe) log.rpe = rpe; if (back) log.back = back; }
  let offers = [];
  if (session.type === "strength" && rpe !== "hard" && back !== "worse") offers = applyProgression(session);
  if (back === "worse") S.pain[dayShift(todayKey(), 1)] = S.pain[dayShift(todayKey(), 1)] || "yellow"; // be gentle tomorrow
  save();

}

/* ---------- weeks: ring + weekly streak (the primary consistency signal) ---------- */
const weekStart = (key) => { // Monday
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dkey(new Date(y, m - 1, d - ((dt.getDay() + 6) % 7)));
};

function weekTarget(ws) {
  const base = S.profile?.weeklyTarget || 4;
  let red = 0;
  for (let i = 0; i < 7; i++) if (S.pain[dayShift(ws, i)] === "red") red++;
  return Math.max(1, base - red); // red back days lower the bar, never break it
}

  const days = new Set();
  for (const l of S.log) if (countsForWeek(l) && weekStart(l.date) === ws) days.add(l.date);
  return days.size;
}

  const ws = weekStart(todayKey());

  // consecutive full weeks hitting the target, counting this week only once it's hit
  const first = S.log.length ? weekStart(S.log.reduce((a, l) => (l.date < a ? l.date : a), S.log[0].date)) : ws;
  let streak = done >= target ? 1 : 0;
  let w = dayShift(ws, -7);
  while (w >= first) {
    if (weekCount(w) >= weekTarget(w)) { streak++; w = dayShift(w, -7); } else break;
  }
  return { ws, target, done, streak, activeDays: new Set(S.log.map((l) => l.date)).size };
}

/* ---------- resume an interrupted session ---------- */
function snapshotActive(sess) {
  S.active = {
    date: todayKey(), kind: sess.kind, type: sess.type, name: sess.name, dayType: sess.dayType || null, part: sess.part || null,
    idx: sess.idx, setIdx: sess.setIdx, startTs: sess.startTs,
    items: sess.items.map((i) => ({ exId: i.exId, sets: i.sets, target: i.target, timed: !!i.timed, warmup: !!i.warmup,
      label: i.label || null, note: i.note || null, pyramid: i.pyramid || null, ladder: i.ladder || null, tkey: i.tkey || null,
      win: i.win || null, rungIdx: i.rungIdx ?? null, volume: !!i.volume, main: !!i.main, setLog: i.setLog || [] })),

/* ---------- ICS calendar generation (iOS-verified path) ---------- */
const ICS_DAY = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

    if (enc.encode(cur + ch).length > (out.length ? 73 : 74)) { out.push(cur); cur = ch; }
    else cur += ch;

  const now = new Date();
  for (let i = 0; i < 8; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    if (d.getDay() !== dow) continue;
    if (i === 0) {
      const [h, m] = timeHHMM.split(":").map(Number);

  const start = icsLocal(dateKey, timeHHMM);

  const endMin = Math.min(sh * 60 + sm + durMin, 23 * 60 + 59); // cap at same-day 23:59 (avoid DTEND < DTSTART)
  const endHH = String(Math.floor(endMin / 60)).padStart(2, "0"), endMM = String(endMin % 60).padStart(2, "0");
  const end = icsLocal(dateKey, `${endHH}:${endMM}`);

    "BEGIN:VEVENT",
    `UID:${uid()}@forge.app`, // always-new UID: avoids the iOS re-import silent-fail bug
    `DTSTAMP:${icsStamp()}`,
    `DTSTART:${start}`,
    `DTEND:${end}`,
    `SUMMARY:${icsEscape(title)}`,
    `DESCRIPTION:${icsEscape(desc)}`,

    `TRIGGER:-PT${Math.max(0, alertMin)}M`, "END:VALARM", "END:VEVENT");

}

  const p = S.profile;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "METHOD:PUBLISH", "PRODID:-//FORGE//Workout//EN", "CALSCALE:GREGORIAN"];
  for (const dow of p.trainDays) {
    lines.push(...makeEvent({
      title: "🔥 FORGE — Training day",
      desc: `${p.anchor ? "Cue: " + p.anchor + ". " : ""}Open the app, hit Start. Even 5 minutes counts. (Never within the first hour after waking — discs are vulnerable then.)`,
      dateKey: nextWeekday(dow, p.time), timeHHMM: p.time, durMin: 45,
      rrule: `FREQ=WEEKLY;BYDAY=${ICS_DAY[dow]};COUNT=12`, alertMin: S.settings.alertMin,
    }));
  }
  lines.push("END:VCALENDAR");
  return lines.map(icsFold).join("\r\n") + "\r\n";
}
function buildSpineICS(timeHHMM) {
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "METHOD:PUBLISH", "PRODID:-//FORGE//Spine//EN", "CALSCALE:GREGORIAN"];
  const now = new Date();
  const [h, m] = timeHHMM.split(":").map(Number);
  const passed = now.getHours() * 60 + now.getMinutes() >= h * 60 + m;
  lines.push(...makeEvent({
    title: "🧘 FORGE — 10-min Spine Reset",
    desc: "Cat-camel, curl-up, side plank, bird dog. Daily back armour — never within an hour of waking.",
    dateKey: passed ? dayShift(todayKey(), 1) : todayKey(),
    timeHHMM, durMin: 15, rrule: "FREQ=DAILY;COUNT=84", alertMin: S.settings.alertMin,
  }));
  lines.push("END:VCALENDAR");
  return lines.map(icsFold).join("\r\n") + "\r\n";
}

/* ---------- getting files to the user ----------

   fallback there. Plain Safari gets the normal download. */

    try {
      await window.claude.downloads.save({ filename: name, data: content });
      return "downloaded";
    } catch (e) {
      if (e && e.code === "declined") return "cancelled";
      openCopySheet(name, content, label); // e.g. .ics is outside the viewer's allowlist
      return "copy";
    }
  }
  if (isConstrained()) {

      }

    openCopySheet(name, content, label); // defined in ui.js
    return "copy";
  }
  downloadFile(name, content, mime);

/* ---------- backup ---------- */
function exportData() { return deliverFile(`forge-backup-${todayKey()}.json`, JSON.stringify(S, null, 1), "application/json", "Backup"); }

function makeWav(freq, ms, count = 1, gapMs = 90) {
  const rate = 22050, amp = freq ? 0.6 : 0;
  const seg = Math.floor(rate * ms / 1000), gap = Math.floor(rate * gapMs / 1000);
  const total = count * seg + (count - 1) * gap;
  const data = new Int16Array(total);
  for (let c = 0; c < count; c++) {
    const off = c * (seg + gap);
    for (let i = 0; i < seg; i++) {
      const env = Math.min(1, i / (rate * 0.01), (seg - i) / (rate * 0.03));
      data[off + i] = Math.round(Math.sin(2 * Math.PI * freq * i / rate) * amp * env * 32767);
    }
  }
  const buf = new ArrayBuffer(44 + data.length * 2);
  const v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); v.setUint32(4, 36 + data.length * 2, true); ws(8, "WAVE"); ws(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ws(36, "data"); v.setUint32(40, data.length * 2, true);
  new Int16Array(buf, 44).set(data);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

let wakeLock = null, wantWake = false;
async function acquireWake() {
  wantWake = true;
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {}
}
function releaseWake() {
  wantWake = false;
  try { wakeLock && wakeLock.release(); } catch (_) {} wakeLock = null;
}

  if (document.visibilityState === "visible" && wantWake) acquireWake();
});

function applyTheme() {
  const t = S.settings.theme;
  if (t === "auto") document.documentElement.removeAttribute("data-theme");

  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => { m.content = dark ? "#0E1320" : "#F4F6FA"; });
}

function todayState() {
  const t = todayKey();
  const pain = painToday();
  const logs = sessionsOn(t);
  const isTrainDay = S.profile.trainDays.includes(new Date().getDay());
  const dayType = todaysDayType();
  const plan = S.plans[t]?.mode || "one";
  const strength = logs.filter((l) => l.type === "strength");
  const p1 = strength.find((l) => l.dayType === dayType && l.part === 1);
  const mainDone = strength.some((l) => !l.part || l.part === 2);
  const spineDone = logs.filter((l) => l.type === "spine").length;
  const walks = logs.filter((l) => l.type === "walk").length;
  const quickDone = logs.some((l) => l.type === "quick" || l.type === "rescue");
  const late = new Date().getHours() >= 20 && logs.length === 0;
  return { t, pain, logs, isTrainDay, dayType, plan, p1, mainDone, spineDone, walks, quickDone, late, strength };
}

      ${done ? "" : `<button class="btn btn-primary block" data-a="start-spine">${I("play")}Start Spine Reset · 10 min</button>`}

    </section>`;
  }

  // done for today → second-session option

    return `<section class="card hero" data-tone="good">
      <div class="row"><span class="tile done">${I("check")}</span><span class="t-cap">Done for today</span></div>
